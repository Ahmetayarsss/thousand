<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSS Çerçeve Prototip</title>
<style>
  :root{
    --ink:#1B2430; --card:#ffffff; --badge:#3B6EA5;
    --ok:#0E8074; --tr:#B03A2E; --ex:#5B6B7B; --bg:#eef1f5;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#20242b}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--ink);
       display:flex;flex-direction:column;align-items:center;gap:22px;padding:28px 16px 60px}
  h1{font-size:16px;font-weight:800;margin:4px 0 0;opacity:.75}
  .note{font-size:13px;color:#6b7280;max-width:360px;text-align:center;line-height:1.5}

  /* ---- KART ---- */
  .card{
    position:relative;width:300px;height:470px;background:var(--card);
    border:1px solid #c7d2e3;border-radius:20px;overflow:hidden;
    box-shadow:0 10px 26px rgba(20,30,50,.16);
  }

  /* ---- SAF CSS SÜSLÜ ÇERÇEVE (hiç SVG yok, 4 köşe tam simetrik) ---- */
  /* Kesintisiz ÇİFT yuvarlak çerçeve: iki iç-içe border. Birleşim yeri yok. */
  .frame{position:absolute;inset:13px;pointer-events:none;color:var(--ink);
         border:1.6px solid var(--ink);border-radius:18px}
  /* boşluk: üst/alt 5px, sol/sağ 3px */
  .frame::before{content:"";position:absolute;inset:5px 3px;
         border:1.6px solid var(--ink);border-radius:13px}

  /* Köşe ornamenti — tek tasarım, transform ile 4 köşeye simetrik yansır.
     İç border'ın içine, çizgilere çakışmadan yerleşir. */
  .frame .cnr{position:absolute;width:22px;height:22px}
  .frame .cnr.tl{top:5px;left:3px}
  .frame .cnr.tr{top:5px;right:3px;transform:scaleX(-1)}
  .frame .cnr.bl{bottom:5px;left:3px;transform:scaleY(-1)}
  .frame .cnr.br{bottom:5px;right:3px;transform:scale(-1,-1)}
  /* çeyrek yay (yaprak): iç köşe merkezli, içe bombeli, uçlar çizgide */
  .frame .cnr::before{content:"";position:absolute;top:0;left:0;width:18px;height:18px;
    border-bottom:1.4px solid var(--ink);border-right:1.4px solid var(--ink);border-bottom-right-radius:18px}
  /* dolu nokta — iç dikdörtgene değecek şekilde köşede */
  .frame .cnr b{position:absolute;top:0.5px;left:0.5px;width:4.4px;height:4.4px;
    background:var(--ink);border-radius:50%}

  /* ---- İÇERİK ---- */
  .lvl{position:absolute;top:28px;right:28px;background:var(--badge);color:#fff;
       font:800 11px system-ui;padding:3px 9px;border-radius:7px;letter-spacing:.3px}
  .content{position:absolute;inset:26px;display:flex;flex-direction:column;
           align-items:center;justify-content:center;text-align:center;gap:10px}
  .word{font-size:34px;font-weight:800}
  .okunus{color:var(--ok);font-weight:800;font-size:15px}
  .mean{color:var(--tr);font-weight:800;font-size:24px}
  .ex{color:var(--ex);font-style:italic;font-size:14px}
</style>
</head>
<body>
  <h1>CSS Çerçeve Prototipi (SVG yok)</h1>

  <!-- ÖN YÜZ: kelime -->
  <div class="card">
    <div class="frame">
      <span class="edge t"></span><span class="edge b"></span>
      <span class="edge l"></span><span class="edge r"></span>
      <span class="cnr tl"><b></b></span><span class="cnr tr"><b></b></span>
      <span class="cnr bl"><b></b></span><span class="cnr br"><b></b></span>
    </div>
    <span class="lvl">A1</span>
    <div class="content"><div class="word">style</div></div>
  </div>

  <!-- ARKA YÜZ: cevap -->
  <div class="card">
    <div class="frame">
      <span class="edge t"></span><span class="edge b"></span>
      <span class="edge l"></span><span class="edge r"></span>
      <span class="cnr tl"><b></b></span><span class="cnr tr"><b></b></span>
      <span class="cnr bl"><b></b></span><span class="cnr br"><b></b></span>
    </div>
    <span class="lvl">A1</span>
    <div class="content">
      <div class="okunus">Okunuş: STAYL</div>
      <div class="mean">tarz, stil</div>
      <div class="ex">I like your style of dressing.</div>
    </div>
  </div>

  <p class="note">Sürüm 8 · Boşluk: yan 3px / üst‑alt 5px · dolu nokta yayın ortasında.<br>
  Bu çerçeve tamamen border + border‑radius ile — hiç SVG yok, foreignObject birebir çeker.</p>
</body>
</html>
