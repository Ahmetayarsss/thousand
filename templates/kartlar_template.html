<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oxford 3000 · Kelime Kartları</title>
<style>
:root{--bg:#F4F6F9;--card:#fff;--ink:#1B2430;--muted:#7A8699;--line:#E6EAF1;--green:#2E9E5B;--green-d:#238049;--red:#D9544D;--red-d:#B83E38;--tr:#B03A2E;--ok:#0E8074;--accent:#3B6EA5;--speak:#E5892B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}
#app{max-width:600px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.top{flex:0 0 auto}
.moderow{display:flex;gap:6px;background:#E9EDF3;border-radius:11px;padding:4px;margin:2px 0 8px}
.moderow button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:800;font-size:13.5px;padding:9px 0;border-radius:8px;cursor:pointer}
.moderow button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grouprow{display:flex;gap:7px;align-items:center}
.nav{border:0;background:var(--ink);color:#fff;font-size:15px;font-weight:800;width:34px;height:34px;border-radius:9px;cursor:pointer;flex:0 0 auto}
.nav:disabled{opacity:.35}
select{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 9px;font-size:13.5px;font-weight:600}
.acc{display:inline-flex;background:#E9EDF3;border-radius:8px;padding:2px;flex:0 0 auto}
.acc button{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:11.5px;padding:6px 9px;border-radius:7px;cursor:pointer}
.acc button.on{background:#fff;color:var(--ink)}
.progline{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.bar{flex:1;height:7px;border-radius:6px;background:#E6EAF1;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.counter{font-weight:800;color:var(--ink);flex:0 0 auto}

.stage{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding-top:8px}
.card{flex:1 1 auto;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 26px rgba(20,30,50,.07);padding:22px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none;position:relative;min-height:0;overflow:auto}
.card:active{transform:scale(.996)}
.lvl{position:absolute;top:14px;right:16px;font-size:11px;font-weight:800;color:#fff;background:var(--accent);border-radius:6px;padding:2px 8px}
.spk{position:absolute;top:12px;left:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--speak);color:#fff;font-size:18px;display:none;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(229,137,43,.4)}
.spk.show{display:grid}
.spk:active{transform:scale(.92)}
.q{font-size:34px;font-weight:800;letter-spacing:-.01em;line-height:1.12}
.q.small{font-size:27px}
.tap{margin-top:18px;font-size:12px;color:var(--muted)}
.ansbox{border-top:1px dashed var(--line);margin-top:18px;padding-top:16px;width:100%}
.ok{color:var(--ok);font-weight:700;font-size:15px}
.mean{font-size:22px;font-weight:800;margin-top:4px}
.mean.tr{color:var(--tr)} .mean.en{color:var(--ink)}
.ex{color:#5B6B7B;font-size:14px;font-style:italic;margin-top:10px}
.controls{flex:0 0 auto;display:flex;gap:10px;margin-top:12px}
.btn{flex:1;border:0;border-radius:14px;padding:16px 0;font-size:15.5px;font-weight:800;cursor:pointer;color:#fff}
.btn:active{transform:translateY(1px)}
.btn.again{background:var(--red)} .btn.know{background:var(--green)}
.hidden{display:none!important}
.cheat{position:fixed;inset:0;z-index:9999;background:#fff;display:none;align-items:center;justify-content:center;padding:34px;text-align:center}
.cheat.show{display:flex}
.cheat-msg{color:#111;font-size:30px;font-weight:900;line-height:1.3;max-width:620px}

.result{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.score{font-size:60px;font-weight:900;letter-spacing:-.03em}
.score small{display:block;font-size:15px;font-weight:700;color:var(--muted);margin-top:2px}
.rmsg{color:var(--muted);font-size:14px;margin:10px 0 4px}
.wronglist{width:100%;max-width:420px;margin-top:14px;text-align:left;max-height:34vh;overflow:auto}
.wr{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:13.5px}
.wr b{color:var(--ink)} .wr span{color:var(--tr)}
.ractions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.ractions button{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:800;font-size:13px;border-radius:10px;padding:11px 14px;cursor:pointer}
.ractions .prim{background:var(--ink);color:#fff;border-color:var(--ink)}
.warn{font-size:11.5px;color:#8A6D3B;background:#FCF3E3;border:1px solid #F2E0BE;border-radius:9px;padding:8px 10px;margin-top:8px;display:none}
.seclabel{flex:1;font-size:15px;font-weight:800;color:var(--ink)}
</style><script src="progress.js"></script></head><body><div id="app">
<div class="top">
  <div class="moderow" id="moderow">
    <button data-m="test" class="on">Test (çalışma)</button>
    <button data-m="exam">Sınav</button>
  </div>
  <div class="grouprow">
    <div class="seclabel" id="seclabel"></div>
  </div>
  <div class="progline">
    <span class="bar" id="bar"></span>
    <span class="counter" id="counter"></span>
  </div>
  <div class="warn" id="warn">İlerlemenin kaydı için dosyayı <b>tarayıcıda</b> (Chrome/Safari) aç. Sesi duymak için de tarayıcı gerekir.</div>
</div>

<div class="stage" id="stage">
  <div class="card" id="card">
    <span class="lvl" id="lvl"></span>
    <button class="spk" id="spk" aria-label="Dinle">🔊</button>
    <div class="q" id="q"></div>
    <div class="tap" id="tap">Cevap için karta dokun</div>
    <div class="ansbox hidden" id="ansbox"></div>
  </div>
  <div class="controls hidden" id="ctrl">
    <button class="btn again" id="again"></button>
    <button class="btn know" id="know"></button>
  </div>
</div>

<div class="stage hidden" id="resultbox">
  <div class="result">
    <div class="score" id="score"></div>
    <div class="rmsg" id="rmsg"></div>
    <div class="wronglist" id="wronglist"></div>
    <div class="ractions">
      <button class="prim" id="r-again">Tekrar sına</button>
      <button id="r-study">Yanlışları çalış</button>
      <button id="r-next">Sonraki grup →</button>
    </div>
  </div>
</div>
</div>
<div class="cheat" id="cheat"><div class="cheat-msg"></div></div>
<script>
const GROUPS=__GROUPS_JSON__;
const EKEY="ox3000_exams_v1";
let storageOK=true;
try{localStorage.setItem("t_","1");localStorage.removeItem("t_");}catch(e){storageOK=false;}
const now=()=>Date.now();

// TTS
let LANG="en-US",voices=[];const synth=window.speechSynthesis;
function loadV(){voices=synth?synth.getVoices():[];}
if(synth){loadV();synth.onvoiceschanged=loadV;}else{document.getElementById('warn').style.display='block';}
function pick(l){if(!voices.length)loadV();return voices.find(v=>v.lang===l)||voices.find(v=>v.lang&&v.lang.slice(0,2)===l.slice(0,2))||null;}
function speak(t){if(!synth)return;synth.cancel();const u=new SpeechSynthesisUtterance(t);const v=pick(LANG);if(v)u.voice=v;u.lang=LANG;u.rate=0.85;synth.speak(u);}

let gi=(window.OX?Math.max(0,Math.min(OX.current(),GROUPS.length-1)):0),mode='test',cur=null,side=0;
let queue=[],testTotal=0,examList=[],examIdx=0,examWrong=[],examTotal=0,examScore=0;
let tPrompt=0,tReveal=0,suspStreak=0;   // hile tespiti: soru gösterim / çevirme anı, art arda şüpheli sayısı

function setSecLabel(){const g=GROUPS[gi];document.getElementById('seclabel').textContent='Bölüm '+String(g.no).padStart(2,'0')+' · '+g.level;}
function drawBar(){const t=testTotal||GROUPS[gi].items.length,doneN=Math.max(0,t-queue.length);document.getElementById('bar').innerHTML=`<i style="width:${t?doneN/t*100:0}%;background:var(--green)"></i>`;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function dirFor(){return Math.random()<0.5?'tr2en':'en2tr';}

function renderPrompt(){
  const g=GROUPS[gi];document.getElementById('lvl').textContent=g.level;
  side=0;const q=document.getElementById('q'),ans=document.getElementById('ansbox'),spk=document.getElementById('spk');
  ans.classList.add('hidden');ans.innerHTML='';document.getElementById('tap').style.display='';document.getElementById('ctrl').classList.add('hidden');spk.classList.remove('show');
  const front=(cur._dir==='tr2en')?(cur.tr||'—'):cur.w;
  q.className='q'+((front&&front.length>18)?' small':'');
  q.textContent=front;
  tPrompt=performance.now();   // soru gösterildi
}
function reveal(){
  if(side===1)return;side=1;tReveal=performance.now();document.getElementById('tap').style.display='none';
  const ans=document.getElementById('ansbox'),spk=document.getElementById('spk');let h='';
  if(cur._dir==='tr2en'){h+=`<div class="mean en">${cur.w}</div>`;if(cur.ok)h+=`<div class="ok">Okunuş: ${cur.ok}</div>`;}
  else{if(cur.ok)h+=`<div class="ok">Okunuş: ${cur.ok}</div>`;h+=`<div class="mean tr">${cur.tr||'—'}</div>`;}
  if(cur.ex&&cur.ex.length)cur.ex.forEach(s=>{h+=`<div class="ex">${s}</div>`;});
  ans.innerHTML=h;ans.classList.remove('hidden');spk.classList.add('show');
  document.getElementById('ctrl').classList.remove('hidden');
}

/* ---- TEST (çalışma): grubun tüm kelimelerini serbest çalış — aralıklı tekrar/günlük limit yok ---- */
function startTest(){mode='test';document.getElementById('resultbox').classList.add('hidden');document.getElementById('stage').classList.remove('hidden');
  document.getElementById('again').textContent='Tekrar';document.getElementById('know').textContent='Biliyorum';
  const g=GROUPS[gi];queue=shuffle(g.items.slice());testTotal=queue.length;
  drawBar();nextTest();}
function nextTest(){drawBar();
  document.getElementById('counter').textContent=queue.length+' kaldı';
  if(!queue.length){return testDone();}
  cur=queue.shift();cur._dir=dirFor();renderPrompt();}
function gradeTest(know){if(checkSpeed())return;if(!know)queue.push(cur);nextTest();}   // "Tekrar" → bu turda sona ekle (kayıt yok)
function testDone(){showResult(String(testTotal),'kelime çalışıldı','Bu bölümü baştan sona çalıştın. 👏',[],true);}

/* ---- EXAM ---- */
function startExam(){mode='exam';document.getElementById('resultbox').classList.add('hidden');document.getElementById('stage').classList.remove('hidden');
  document.getElementById('again').textContent='Bilemedim';document.getElementById('know').textContent='Bildim';
  const g=GROUPS[gi];examList=shuffle(g.items.slice());examIdx=0;examWrong=[];examTotal=examList.length;examScore=0;
  document.getElementById('bar').innerHTML='';nextExam();}
function nextExam(){document.getElementById('counter').textContent=(examIdx+1)+'/'+examTotal;
  if(examIdx>=examList.length)return examDone();
  cur=examList[examIdx];cur._dir=dirFor();renderPrompt();}
function gradeExam(correct){if(checkSpeed())return;
  if(correct){examScore++;}else{examWrong.push(cur);}examIdx++;nextExam();}

/* ---- Hile yakalama: test + sınavda geçerli; kademeli mesaj; 4.'ten itibaren mevcut turu sıfırlar (gelişim korunur) ---- */
const CKEY="ox3000_cheat_v1";
// Sayacı bu sürümde bir kez sıfırla (flag sayesinde tekrar sıfırlamaz).
try{if(!localStorage.getItem('ox3000_cheat_migr_v4')){localStorage.removeItem(CKEY);localStorage.setItem('ox3000_cheat_migr_v4','1');}}catch(e){}
function cheatN(){try{return (parseInt(localStorage.getItem(CKEY),10))||0;}catch(e){return 0;}}
// true dönerse: mevcut sınav/test turu yeniden başlatıldı → çağıran devam etmemeli.
function checkSpeed(){
  const flip=tReveal-tPrompt, decide=performance.now()-tReveal;
  if(flip>0&&flip<300&&decide<350){ if(++suspStreak>=2){ suspStreak=0; return cheatCaught(); } }
  else suspStreak=0;
  return false;
}
function restartRound(){ start(); }   // yalnız mevcut sınav/test turunu baştan başlatır; ilerleme (bölümler/seviye) DOKUNULMAZ
function cheatCaught(){   // true dönerse mevcut tur yeniden başlatıldı
  let n=cheatN()+1;try{localStorage.setItem(CKEY,n);}catch(e){}
  if(n<4){
    showCheat(n===1?"hayiydiy gaydeş":(n===2?"Yaşayan en hızlı insan Barry Allen'ın bilinmeyen bı akrabası falan mısın bu ne hız":"son uyarım"),false);
    return false;                          // sadece uyarı; sınav/test kaldığı yerden sürer
  }
  // 4. ve sonrası: SADECE mevcut sınav/test turu sıfırlanır (baştan başlar); gelişim/bölümler korunur.
  if(n===4) showCheat("sen kaşındın",true);// yalnız 4.'te mesaj; kapanınca tur baştan
  else restartRound();                     // 5. ve sonrası: mesajsız, hemen tur baştan
  return true;
}
function showCheat(msg,restart){
  if(synth)synth.cancel();
  const o=document.getElementById('cheat');o.querySelector('.cheat-msg').textContent=msg;o.classList.add('show');
  const dur=Math.min(6000,Math.max(3000,msg.length*60));   // mesaj uzunluğuna göre okunabilir süre
  setTimeout(()=>{o.classList.remove('show');tPrompt=performance.now();if(restart)restartRound();},dur);
}
function examDone(){const pct=Math.round(examScore/examTotal*100);
  const wasReview=!!(window.OX&&OX.review()!=null);   // examResult REV'i temizlemeden önce yakala
  try{const ex=JSON.parse(localStorage.getItem(EKEY)||'[]');ex.push({t:now(),g:gi,no:GROUPS[gi].no,level:GROUPS[gi].level,score:examScore,total:examTotal,pct:pct});localStorage.setItem(EKEY,JSON.stringify(ex.slice(-100)));}catch(e){}
  const pass=(examScore===examTotal);              // geçmek için %100 gerekli
  const res=(window.OX?OX.examResult(gi,GROUPS[gi].no,pass):(pass?'green':'reopen'));
  const gold=(res==='gold');                        // 4. tekrar geçildi → tam öğrenme
  const wl=examWrong.map(w=>`<div class="wr"><b>${w.w}</b> — <span>${w.tr||''}</span></div>`).join('');
  const last=(gi>=GROUPS.length-1);
  let msg;
  if(pass){
    if(gold) msg='Tam öğrendin! ⭐ Bu bölüm altın oldu — artık tekrar istenmeyecek.';
    else if(wasReview) msg='Tekrar tamamlandı! ✓ Bölüm tazelendi.';
    else msg='Bölümü geçtin! ✓ '+(last?'Tüm bölümleri bitirdin! 🎉':'Sıradaki bölüm açıldı.');
  }else{
    msg='%'+pct+' — bu bölümü geçemedin. (Geçmek için hepsi doğru olmalı.) Bölüm gri kaldı, yeniden çalış.';
  }
  showResult(pass?(gold?'⭐':'✓'):'%'+pct,examScore+'/'+examTotal+' doğru',msg,wl,false);
  document.getElementById('r-next').textContent=pass?((wasReview||last)?'Listeye dön':'Sonraki bölüm →'):'Listeye dön (yeniden çalış)';
  document.getElementById('r-next').style.display='';}

function showResult(big,small,msg,wlHtml,isTest){
  document.getElementById('stage').classList.add('hidden');document.getElementById('resultbox').classList.remove('hidden');
  document.getElementById('score').innerHTML=big+'<small>'+small+'</small>';
  document.getElementById('rmsg').textContent=msg;
  document.getElementById('wronglist').innerHTML=wlHtml||'';
  document.getElementById('r-again').textContent=isTest?'Tekrar çalış':'Tekrar sına';
  document.getElementById('r-study').style.display=(wlHtml&&wlHtml.length)?'':'none';
  if(isTest)document.getElementById('r-next').textContent='Listeye dön';
}

function start(){document.getElementById('resultbox').classList.add('hidden');(mode==='test'?startTest:startExam)();}
document.getElementById('moderow').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...e.currentTarget.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;start();});
document.getElementById('card').addEventListener('click',reveal);
document.getElementById('spk').addEventListener('click',e=>{e.stopPropagation();speak(cur.w);});
document.getElementById('again').addEventListener('click',()=>{mode==='test'?gradeTest(false):gradeExam(false);});
document.getElementById('know').addEventListener('click',()=>{mode==='test'?gradeTest(true):gradeExam(true);});
document.getElementById('r-again').addEventListener('click',start);
document.getElementById('r-study').addEventListener('click',()=>{mode='test';document.querySelectorAll('#moderow button').forEach(x=>x.classList.toggle('on',x.dataset.m==='test'));
  queue=shuffle(examWrong.slice());testTotal=queue.length;document.getElementById('resultbox').classList.add('hidden');document.getElementById('stage').classList.remove('hidden');
  document.getElementById('again').textContent='Tekrar';document.getElementById('know').textContent='Biliyorum';nextTest();});
document.getElementById('r-next').addEventListener('click',()=>{location.href='index.html';});
document.body.addEventListener('touchstart',()=>{if(synth&&!voices.length)loadV();},{once:true});
// Tekrar butonundan gelindiyse (?exam=1) doğrudan sınav modunda başla
try{if(new URLSearchParams(location.search).get('exam')==='1'){mode='exam';document.querySelectorAll('#moderow button').forEach(x=>x.classList.toggle('on',x.dataset.m==='exam'));}}catch(e){}
setSecLabel();start();
</script></body></html>
