name: Yeni uygulama APK (Thousand Yeni)

# Yeni uygulama (mobile/, React Native) ANA UYGULAMADAN AYRI, deneme için: ayrı ad ("Thousand Yeni"),
# ayrı paket (io.github.ahmetayarsss.thousand.yeni → telefonda ana uygulamanın yanına kurulur, verisi
# ayrıdır), ayrı yayın dalı (mobil) ve ayrı release (mobil-latest). Ana uygulamanın yayınına
# (main → build-apk.yml → apk-latest) ve telefonlardaki güncelleyiciye dokunmaz; güncelleyici yalnız
# apk-latest'ten indirir. "mobil" dalı kullanıcının seçtiği yayın kanalıdır (main gibi).
# PR'larda (mobil'e) yalnız DENEME: APK mühürsüz derlenir, hiçbir şey yayınlanmaz.

on:
  workflow_dispatch:
  push:
    branches:
      - mobil
  pull_request:
    branches:
      - mobil

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('mobil-deneme-{0}', github.ref) || 'mobil-yayin' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Yalnız mobil dalından yayın
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/mobil'
        run: |
          echo "::error::Yeni uygulama yalnız mobil dalından yayınlanır (şu an: ${{ github.ref_name }})."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Testler, doğrulama, bekçi
        run: |
          TZ=Europe/Istanbul node tests/srs.test.js
          node tests/log.test.js
          TZ=Europe/Istanbul node tests/oturum.test.js
          TZ=Europe/Istanbul node tests/ilerleme.test.js
          node tests/sozluk.test.js
          node tests/cevirme.test.js
          python3 scripts/validate.py
          python3 scripts/bekci.py

      # Ana uygulamayla aynı imza anahtarı (GitHub gizli ayarları). Paket adı farklı olduğu için ana
      # uygulamayı etkilemez; aynı anahtarla imzalı sonraki APK'lar bunun üstüne kurulur.
      - name: İmza anahtarını hazırla
        if: github.event_name != 'pull_request'
        env:
          IMZA_ANAHTARI: ${{ secrets.IMZA_ANAHTARI }}
          IMZA_PAROLA: ${{ secrets.IMZA_PAROLA }}
        run: |
          if [ -z "$IMZA_ANAHTARI" ] || [ -z "$IMZA_PAROLA" ]; then
            echo "::error::IMZA_ANAHTARI / IMZA_PAROLA gizli ayarları yok; yayın yapılmadı."
            exit 1
          fi
          printf '%s' "$IMZA_ANAHTARI" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/imza.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/imza.p12" -storepass "$IMZA_PAROLA" -alias thousand > /dev/null \
            || { echo "::error::İmza anahtarı açılamadı."; exit 1; }
          echo "IMZA_DOSYASI=$RUNNER_TEMP/imza.p12" >> "$GITHUB_ENV"

      - name: Bağımlılıklar (npm ci)
        working-directory: mobile
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci denemesi $i başarısız, tekrar..."; sleep $((i * 10))
          done

      # android/ repoda yok: app.json'dan üretilir (sürüm kodu = bu iş akışının çalışma numarası).
      - name: Android projesini üret (expo prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      # Yayın derlemesi (hata ayıklanamaz). Yalnız 64 bit arm (kullanıcı kararı: APK yarıya iner; 32 bit
      # işlemcili çok eski telefonlara kurulmaz).
      - name: APK derle (release)
        working-directory: mobile/android
        env:
          IMZA_PAROLA: ${{ secrets.IMZA_PAROLA }}
        run: |
          set -o pipefail
          args=(assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a)
          if [ -n "${IMZA_DOSYASI:-}" ]; then   # PR denemesinde yok: Expo'nun hata ayıklama anahtarı
            args+=("-Pandroid.injected.signing.store.file=$IMZA_DOSYASI" "-Pandroid.injected.signing.store.password=$IMZA_PAROLA"
                   "-Pandroid.injected.signing.key.alias=thousand" "-Pandroid.injected.signing.key.password=$IMZA_PAROLA")
          fi
          ./gradlew "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Hata logunu yükle (teşhis)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobil-gradle-log
          path: ${{ runner.temp }}/gradle.log
          if-no-files-found: warn

      - name: APK'yı adlandır, imzayı ve paketi doğrula
        if: github.event_name != 'pull_request'
        env:
          IMZA_PAROLA: ${{ secrets.IMZA_PAROLA }}
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk ThousandYeni.apk
          beklenen=$(keytool -list -storetype PKCS12 -keystore "$IMZA_DOSYASI" -storepass "$IMZA_PAROLA" -alias thousand | grep -o 'SHA-256): .*' | cut -d' ' -f2)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n 1)
          gercek=$("$apksigner" verify --print-certs ThousandYeni.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "beklenen: $beklenen"; echo "APK:      $gercek"
          [ "$(echo "$beklenen" | tr -d ':' | tr 'A-F' 'a-f')" = "$gercek" ] || { echo "::error::APK yanlış anahtarla imzalı"; exit 1; }
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -n 1)
          "$aapt" dump badging ThousandYeni.apk | grep -E "^package:|^application-label:"
          "$aapt" dump badging ThousandYeni.apk | grep -q "^package: name='io.github.ahmetayarsss.thousand.yeni'" \
            || { echo "::error::Paket adı ana uygulamadan ayrı değil"; exit 1; }
          if "$aapt" dump badging ThousandYeni.apk | grep -q "application-debuggable"; then
            echo "::error::APK hata ayıklanabilir (debuggable) derlenmiş"; exit 1
          fi

      - name: mobil-latest etiketini bu commit'e taşı
        if: github.event_name != 'pull_request'
        run: git push --force origin "HEAD:refs/tags/mobil-latest"

      - name: Release olarak yayınla (mobil-latest)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobil-latest
          name: "Thousand Yeni — deneme APK"
          prerelease: true
          files: ThousandYeni.apk
          body: |
            Yeni uygulamanın (React Native) deneme sürümü — mobil dalından otomatik derlenir.
            Ana uygulamadan (Thousand) AYRIDIR: yanına kurulur, ilerlemesi ayrı tutulur, ana uygulamaya dokunmaz.
            Kurmak için: indir → aç → "bilinmeyen kaynaklara izin ver".

      - name: Release'teki eski dosyaları temizle
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in $(gh release view mobil-latest --json assets -q '.assets[].name'); do
            [ "$a" = "ThousandYeni.apk" ] || { echo "siliniyor: $a"; gh release delete-asset mobil-latest "$a" -y; }
          done
