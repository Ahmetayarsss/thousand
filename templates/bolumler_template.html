<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oxford 3000 · Bölümler</title>
<script src="progress.js"></script>
<style>
:root{--bg:#F4F6F9;--card:#fff;--ink:#1B2430;--muted:#7A8699;--line:#E6EAF1;--accent:#3B6EA5;
  --green:#2E9E5B;--green-bg:#E7F5EC;--amber:#E5892B;--amber-bg:#FCF0E1;--gray:#EDF0F4;--gray-ink:#9AA6B4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:600px;margin:0 auto;padding:10px 14px calc(24px + env(safe-area-inset-bottom))}
.head{padding:6px 2px 12px}
.head h1{font-size:22px;font-weight:800;margin:0}
.head p{margin:6px 0 0;color:var(--muted);font-size:12.5px;font-weight:600}
.legend{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sec{position:relative;border-radius:16px;padding:14px 12px;border:1.5px solid var(--line);background:var(--card);min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.sec .no{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.sec .name{font-size:17px;font-weight:800;margin-top:2px}
.sec .lvl{align-self:flex-start;margin-top:8px;font-size:11px;font-weight:800;color:#fff;background:var(--accent);border-radius:6px;padding:2px 8px}
.sec.gray{background:var(--gray);border-color:transparent}
.sec.gray .name{color:var(--gray-ink)}
.sec.green{background:var(--green-bg);border-color:var(--green)}
.sec.yellow{background:var(--amber-bg);border-color:var(--amber)}
.sec .badge{position:absolute;top:10px;right:10px;font-size:15px}
.sec.cur{box-shadow:0 0 0 3px rgba(59,110,165,.35)}
.sec .curtag{position:absolute;top:-9px;left:10px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:2px 7px}
.tekrar{margin-top:9px;border:0;background:var(--amber);color:#fff;font-weight:800;font-size:12.5px;border-radius:9px;padding:8px 0;width:100%;cursor:pointer}
.tekrar:active{transform:scale(.97)}
@media (prefers-color-scheme:dark){
  :root{--bg:#12161C;--card:#1B2129;--ink:#EAF0F7;--muted:#8A96A6;--line:#2A323C;
    --green-bg:#16301F;--amber-bg:#332412;--gray:#20262E;--gray-ink:#69747F}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Bölümler</h1>
    <p>Her bölümün gün sonu sınavını geçtikçe ilerlersin.</p>
    <div class="legend">
      <span><b style="background:var(--gray)"></b>Başlanmadı</span>
      <span><b style="background:var(--green)"></b>Geçildi</span>
      <span><b style="background:var(--amber)"></b>Tekrar zamanı</span>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
const SG=__GROUPS_JSON__;
const cur=window.OX?OX.current():0;
const grid=document.getElementById('grid');
SG.forEach((g,i)=>{
  const st=window.OX?OX.status(g.no):'gray';
  const d=document.createElement('div');
  d.className='sec '+st+(i===cur?' cur':'');
  const badge=st==='green'?'✓':st==='yellow'?'🔁':'';
  d.innerHTML=(i===cur?'<span class="curtag">şu an</span>':'')
    +(badge?'<span class="badge">'+badge+'</span>':'')
    +'<div><div class="no">BÖLÜM '+String(g.no).padStart(2,'0')+'</div>'
    +'<div class="name">'+g.no+'</div></div>'
    +'<span class="lvl">'+g.level+'</span>'
    +(st==='yellow'?'<button class="tekrar" data-i="'+i+'">Tekrar</button>':'');
  grid.appendChild(d);
});
grid.addEventListener('click',e=>{
  const b=e.target.closest('.tekrar'); if(!b)return;
  const i=+b.dataset.i;
  if(window.OX)OX.startReview(i);
  location.href='kartlar.html?exam=1';
});
</script>
</body></html>
