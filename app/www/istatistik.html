<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thousand · İlerleme</title>
<script src="kelimeler.js"></script><script src="log.js"></script><script src="gecis.js"></script><script src="srs.js"></script>
<style>
:root{--bg:#F4F6F9;--card:#fff;--ink:#1B2430;--muted:#7A8699;--line:#E6EAF1;--accent:#3B6EA5;--green:#2E9E5B;--amber:#E5892B;--neu:#C7D0DB;--green-bg:#E7F5EC;--amber-bg:#FCF0E1;--secgray:#EDF0F4;--secgray-ink:#9AA6B4;--gold:#C9A227;--gold-bg:#FBF3D6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:600px;margin:0 auto;padding:8px 14px calc(24px + env(safe-area-inset-bottom))}
.bar-top{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
.back{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--ink);font-weight:800;font-size:14px;padding:6px 12px 6px 4px}
.back span{font-size:20px;line-height:1}
h1{font-size:20px;font-weight:800;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 20px var(--shade);padding:16px;margin-bottom:14px}
.card h2{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin:0 0 12px}
.big{display:flex;gap:10px;text-align:center;margin-bottom:14px}
.big .cell{flex:1;background:var(--bg);border-radius:12px;padding:12px 6px}
.big .n{font-size:26px;font-weight:800;line-height:1}
.big .l{font-size:11px;color:var(--muted);font-weight:700;margin-top:4px}
.big .n.k{color:var(--green)} .big .n.a{color:var(--amber)} .big .n.d{color:var(--accent)}
.pbar{height:12px;border-radius:8px;background:var(--neu);overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
.pbar .k{background:var(--green)} .pbar .a{background:var(--amber)}
.lvl-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.lvl-row .tag{flex:0 0 34px;font-weight:800;font-size:13px;color:#fff;background:var(--accent);border-radius:6px;text-align:center;padding:3px 0}
.lvl-row .track{flex:1;height:9px;border-radius:6px;background:var(--neu);overflow:hidden}
.lvl-row .track i{display:block;height:100%;background:var(--green)}
.lvl-row .num{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--muted);min-width:62px;text-align:right}
.ex-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ex-row:first-of-type{border-top:0}
.ex-row .g{flex:0 0 auto;font-weight:800;font-size:13px}
.ex-row .d{flex:1;font-size:11.5px;color:var(--muted)}
.ex-row .p{flex:0 0 auto;font-weight:800;font-size:15px}
.ex-row .p.hi{color:var(--green)} .ex-row .p.mid{color:var(--amber)} .ex-row .p.lo{color:var(--red,#D9544D)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 0}
.sub{font-size:14px;font-weight:800;color:var(--muted);margin:2px 0 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sec{border-radius:14px;padding:9px 8px 8px;border:1.5px solid var(--line);background:var(--secgray)}
.sec.on{background:var(--card)}
.sec.done{background:var(--green-bg);border-color:var(--green)}
.sec .top{display:flex;align-items:center;justify-content:space-between}
.sec .snum{font-size:12px;font-weight:800;color:var(--ink)}
.sec .slvl{font-size:10px;font-weight:800;color:#fff;background:var(--accent);border-radius:5px;padding:1px 6px}
.sec .cnt{display:flex;justify-content:space-between;margin:7px 0 6px;font-size:15px;font-weight:800}
.sec .cnt .k{color:var(--green)} .sec .cnt .a{color:var(--amber)} .sec .cnt .z{color:var(--secgray-ink)}
.sec .mini{height:5px;border-radius:3px;background:var(--neu);overflow:hidden;display:flex}
.sec .mini i{display:block;height:100%} .sec .mini .k{background:var(--green)} .sec .mini .a{background:var(--amber)}
.legend{display:flex;gap:12px;font-size:11px;font-weight:700;color:var(--muted);margin:-4px 0 10px}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
</style>
<script>(function(){var m=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');function s(){document.documentElement.setAttribute('data-theme',m&&m.matches?'dark':'light');}s();if(m&&m.addEventListener)m.addEventListener('change',s);})();</script><style>:root{--solid:#1B2430;--on-solid:#fff;--field:#fff;--soft:#E9EDF3;--soft2:#EEF2F7;--en:#33414F;--ex:#5B6B7B;--sep:#D5DCE7;--face-line:#c7d2e3;--hdr:rgba(245,246,248,.95);--bad-bg:#FDECEA;--bad-line:#F5C4BD;--bad-ink:#8A2A1E;--good-bg:#E9F7EF;--warn-bg:#FCF3E3;--warn-line:#F2E0BE;--warn-ink:#8A6D3B;--kb:#D9E0EA;--key:#fff;--key2:#B9C4D4;--key3:#AEB9C9;--key4:#8E9BB0;--shade:rgba(20,30,50,.06);--scrim:rgba(20,27,38,.5);--bar:#fff}:root[data-theme=dark]{color-scheme:dark;--bg:#0F141B;--card:#19202A;--ink:#E4E9F0;--ink2:#C5CDD8;--muted:#8D99AA;--line:#2B3542;--accent:#5B8FD0;--green:#35A867;--green-d:#2E9A5E;--red:#DE5F57;--red-d:#E87A72;--tr:#EE8579;--ok:#3CC2B0;--amber:#E5892B;--neu:#3A4554;--green-bg:#17352A;--amber-bg:#3A2C1A;--secgray:#222B36;--secgray-ink:#7C8899;--gold:#D4AE3A;--gold-bg:#3A3218;--dev:#B27AD0;--solid:#2F3B4C;--on-solid:#F2F5F9;--field:#222B36;--soft:#222B36;--soft2:#1E2631;--en:#C5CDD8;--ex:#9AA6B6;--sep:#3A4554;--face-line:#2B3542;--hdr:rgba(15,20,27,.95);--bad-bg:#3A1E1C;--bad-line:#5A2C28;--bad-ink:#F2A59D;--good-bg:#17352A;--warn-bg:#3A2C1A;--warn-line:#5A4428;--warn-ink:#E8C48A;--kb:#151B23;--key:#2A3442;--key2:#3A4656;--key3:#3A4656;--key4:#4A5768;--shade:rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);--bar:#151B23}</style><script src="updater.js"></script><script src="tts-bridge.js"></script><script>(function(){var N='',P='kartlar.html',U='',D='';var x0=0,y0=0,t0=0,ok=false,top=false,bot=false;function go(u){if(window.oxCikisSor)window.oxCikisSor(function(){location.href=u;},u);else location.href=u;}addEventListener('touchstart',function(e){if(e.touches.length!==1){ok=false;return;}var el=e.target;if(el.closest&&el.closest('input,select,button,a,textarea')){ok=false;return;}var t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();ok=true;var se=document.scrollingElement||document.documentElement;top=se.scrollTop<=0;bot=se.scrollTop+innerHeight>=se.scrollHeight-2;},{passive:true});addEventListener('touchend',function(e){if(!ok)return;ok=false;var t=e.changedTouches[0];var dx=t.clientX-x0,dy=t.clientY-y0;if(Date.now()-t0>800)return;if(Math.abs(dy)>=90&&Math.abs(dy)>Math.abs(dx)*1.8){if(dy>0&&U&&top)go(U);else if(dy<0&&D&&bot)go(D);return;}if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8)return;if(dx<0&&N)go(N);else if(dx>0&&P)go(P);},{passive:true});})();</script></head>
<body>
<div class="wrap">
  <div class="bar-top">
    <div><h1>İlerleme</h1><div class="sub" id="seclabel"></div></div>
  </div>

  <div class="card">
    <h2>Genel</h2>
    <div class="big">
      <div class="cell"><div class="n k" id="n-known">0</div><div class="l">Olgun</div></div>
      <div class="cell"><div class="n a" id="n-learn">0</div><div class="l">Öğreniliyor</div></div>
      <div class="cell"><div class="n" id="n-neu">0</div><div class="l">Yeni</div></div>
    </div>
    <div class="pbar"><i class="k" id="pb-k"></i><i class="a" id="pb-a"></i></div>
  </div>

  <div class="card">
    <h2>Seviyeye göre</h2>
    <div id="levels"></div>
  </div>

  <div class="card">
    <h2>Kısımlar</h2>
    <div class="legend"><span><b style="background:var(--green)"></b>olgun</span><span><b style="background:var(--amber)"></b>öğreniliyor</span><span><b style="background:var(--neu)"></b>yeni</span></div>
    <div class="grid" id="secgrid"></div>
  </div>

  <div class="card">
    <h2>Son sınavlar</h2>
    <div id="exams"></div>
  </div>
</div>

<script>
const SG=KELIMELER.map(g=>({no:g.no,level:g.level,ws:g.items.map(it=>it.w),tr:g.items.map(it=>it.tr)}));   // kelimeler.js'ten
SRS.setCatalog(SRS.catalogFromGroups(SG));
const pc=(x,t)=>t?(x/t*100)+'%':'0%';

function render(){
  const lv=SRS.topLevel();
  document.getElementById('seclabel').textContent=SRS.inCycle()+(lv?' · '+lv:'');

  /* Genel */
  const T=SRS.totals();
  document.getElementById('n-known').textContent=T.mature;
  document.getElementById('n-learn').textContent=T.learning;
  document.getElementById('n-neu').textContent=T.fresh;
  document.getElementById('pb-k').style.width=pc(T.mature,T.total);
  document.getElementById('pb-a').style.width=pc(T.learning,T.total);

  /* Kısımlar + seviyeler */
  const byLvl={};
  document.getElementById('secgrid').innerHTML=SG.map((g,i)=>{
    const c=SRS.groupCounts(i);
    const L=byLvl[g.level]||(byLvl[g.level]={total:0,mature:0});L.total+=c.total;L.mature+=c.mature;
    const cls=c.mature===c.total?' done':(c.fresh<c.total?' on':'');
    return '<div class="sec'+cls+'"><div class="top"><span class="snum">Kısım '+g.no+'</span><span class="slvl">'+g.level+'</span></div>'
      +'<div class="cnt"><span class="k">'+c.mature+'</span><span class="a">'+c.learning+'</span><span class="z">'+c.fresh+'</span></div>'
      +'<div class="mini"><i class="k" style="width:'+pc(c.mature,c.total)+'"></i><i class="a" style="width:'+pc(c.learning,c.total)+'"></i></div></div>';
  }).join('');
  document.getElementById('levels').innerHTML=['A1','A2','B1','B2'].filter(l=>byLvl[l]).map(l=>{
    const d=byLvl[l];
    return '<div class="lvl-row"><span class="tag">'+l+'</span>'
      +'<span class="track"><i style="width:'+pc(d.mature,d.total)+'"></i></span>'
      +'<span class="num">'+d.mature+'/'+d.total+'</span></div>';
  }).join('');

  /* Son sınavlar */
  let ss=[];try{ss=JSON.parse(localStorage.getItem('ox3000_sessions_v1')||'[]');}catch(e){}
  ss=ss.slice(-30).reverse();
  document.getElementById('exams').innerHTML=ss.length
    ? ss.map(e=>{const p=e.n?Math.round(e.ok/e.n*100):0,c=p>=90?'hi':p>=70?'mid':'lo';
        const parts=[e.rev?'Tekrar '+e.revOk+'/'+e.rev:'',e.nw?'Yeni '+e.nwOk+'/'+e.nw:''].filter(Boolean).join(' · ');
        return '<div class="ex-row"><span class="g">'+e.ok+'/'+e.n+'</span>'
          +'<span class="d">'+fmtDate(e.t)+' · '+parts+'</span>'
          +'<span class="p '+c+'">%'+p+'</span></div>';}).join('')
    : '<div class="empty">Henüz sınav yapmadın. Çalışma sayfasında “Sınav”ı dene.</div>';
}
function fmtDate(t){const d=new Date(t);const p=n=>('0'+n).slice(-2);
  return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());}
render();
window.addEventListener('pageshow',e=>{if(e.persisted)render();});
</script>
<style>:root{--navh:58px}body{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom))}.oxbar{position:fixed;left:0;right:0;bottom:0;z-index:9990;display:flex;justify-content:center;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.oxbar nav{display:flex;width:100%;max-width:600px}.oxbar a{flex:1;height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font:600 10.5px system-ui,-apple-system,Roboto,Arial,sans-serif;text-decoration:none}.oxbar a.on{color:var(--ink);font-weight:800}.oxbar a.on svg{stroke:var(--accent,#3B6EA5)}.oxbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style><div class="oxbar"><nav aria-label="Sayfalar"><a href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Liste</a><a href="kartlar.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h11a2 2 0 0 1 2 2v13M4 8h11a2 2 0 0 1 2 2v10H6a2 2 0 0 1-2-2z"/></svg>Kartlar</a><a href="istatistik.html" class=on aria-current=page><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>İlerleme</a><a href="sozluk.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h8"/></svg>Sözlük</a><a href="arkadaslar.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 12 0v1M16 3.5a4 4 0 0 1 0 7.5M22 21v-1a6 6 0 0 0-4-5.6"/></svg>Arkadaş</a><a href="ayarlar.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ayarlar</a></nav></div><script>document.querySelectorAll('.oxbar a').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var u=a.getAttribute('href');if(a.classList.contains('on'))return;if(window.oxCikisSor)window.oxCikisSor(function(){location.href=u;},u);else location.href=u;});});</script></body></html>
