<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oxford 3000 · 30 Grup — Sesli + Cambridge</title>
<style>
:root{--bg:#F5F6F8;--card:#fff;--ink:#1B2430;--muted:#7A8699;--line:#E7EAF0;--speak:#E5892B;--speak-d:#C9741A;
--isim:#1E88E5;--fiil:#2E9E5B;--sifat:#8E44AD;--zarf:#E67E22;--diger:#5D6D7E;--tr:#B03A2E;--ok:#0E8074;
--A1:#2E7D32;--A2:#C79100;--B1:#C2185B;--B2:#1565C0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 60px}
header{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;margin:0 -14px 12px}
.title{font-size:17px;font-weight:800;letter-spacing:-.02em}
.title small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px}
.grouprow{display:flex;gap:8px;align-items:center;margin-top:9px}
.nav{border:0;background:var(--ink);color:#fff;font-size:16px;font-weight:800;width:38px;height:38px;border-radius:10px;cursor:pointer;flex:0 0 auto}
.nav:disabled{opacity:.35}
select{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;font-size:14px;font-weight:600;color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:9px}
.seg{display:inline-flex;background:#EAEDF2;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.speed{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.speed input{width:84px}
.playbtns{margin-left:auto;display:flex;gap:6px}
.playall{border:0;background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:8px 13px;border-radius:10px;cursor:pointer}
.playall.stop{background:var(--speak-d)}
.search{width:100%;margin-top:9px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:14px}
.hint{font-size:12px;color:var(--muted);background:#EEF2F7;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;line-height:1.5}
.warn{display:none;background:#FDECEA;border-color:#F5C4BD;color:#8A2A1E}
.lvlbadge{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:2px 7px;vertical-align:middle}
.secbar{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-weight:800;font-size:15px}
.dot{width:12px;height:12px;border-radius:4px}
.count{color:var(--muted);font-weight:600;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--diger);border-radius:14px;padding:11px 13px;margin:9px 0;cursor:pointer}
.card.playing{box-shadow:0 0 0 2px var(--speak),0 6px 18px rgba(229,137,43,.18)}
.row1{display:flex;align-items:center;gap:11px}
.word{font-size:19px;font-weight:800;letter-spacing:-.01em;cursor:pointer}
.tag{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.spk{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;background:var(--speak);color:#fff;font-size:18px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(229,137,43,.35)}
.spk:active{transform:scale(.92)}
.ok{color:var(--ok);font-weight:700;font-size:13.5px;margin-top:6px}
.tr{color:var(--tr);font-size:14px;margin-top:3px}
.en{color:#33414F;font-size:13px;margin-top:3px}
.ex{color:#5B6B7B;font-size:13px;font-style:italic;margin-top:5px;border-top:1px dashed var(--line);padding-top:5px}
.cam{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;color:#0B5FA5;text-decoration:none;background:#E8F1FB;border:1px solid #C4DBF3;border-radius:7px;padding:3px 8px}
.cam:active{background:#D8E8F8}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:24px;line-height:1.6}
.seclabel{font-size:16px;font-weight:800;color:var(--ink);padding:6px 2px 4px}
/* 3000 kelimenin hepsi döngüye girince: küçük havai fişek gösterisi + OLMİŞDUR */
.cele{position:relative;height:62vh;min-height:320px;border-radius:20px;overflow:hidden;background:#141B26;margin-top:6px;cursor:pointer}
.cele canvas{position:absolute;inset:0;width:100%;height:100%}
.cele .olm{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:44px;font-weight:900;letter-spacing:.04em;text-shadow:0 2px 18px rgba(255,200,80,.55);pointer-events:none}
</style><script src="log.js"></script><script src="srs.js"></script></head><body><div class="wrap">
<header>
  <div class="seclabel" id="seclabel"></div>
  <div class="controls">
    <label class="speed"><input id="gap" type="range" min="0" max="3" step="0.25" value="0.5" aria-label="Bekleme"></label>
    <div class="playbtns">
      <button class="playall" id="playall">▶ Listeyi oku</button>
    </div>
  </div>
  <input class="search" id="search" placeholder="Listede ara… (İngilizce/Türkçe)">
</header>
<div class="hint warn" id="warn">Bu tarayıcı sesli okumayı desteklemiyor gibi. Her karttaki <b>Cambridge</b> bağlantısını kullan.</div>
<div id="list"></div>
</div>
<script>
const GROUPS=__GROUPS_JSON__;
const SECS=["İsimler","Fiiller","Sıfatlar","Zarflar","Diğer"];
const SColor={"İsimler":"var(--isim)","Fiiller":"var(--fiil)","Sıfatlar":"var(--sifat)","Zarflar":"var(--zarf)","Diğer":"var(--diger)"};
const posTag={"isim":"isim","fiil":"fiil","sıfat":"sıfat","zarf":"zarf","edat":"edat","bağlaç":"bağlaç","zamir":"zamir","belirteç":"belirteç","ünlem":"ünlem","sayı":"sayı","kip fiili":"kip fiili","yardımcı fiil":"yard. fiil","artikel":"artikel","mastar":"mastar"};
let LANG="en-US",RATE=0.8,GAP=500,voices=[];const synth=window.speechSynthesis;
// Kelime bazlı tekrar: tüm kelimeler sırasıyla katalog; her kelimeye anahtarı (d._k) iliştirilir.
SRS.setCatalog(SRS.catalogFromGroups(GROUPS));
const BYK={};GROUPS.forEach(g=>g.items.forEach(d=>{BYK[d._k]={d:d,g:g};}));
function loadV(){voices=synth?synth.getVoices():[];}
if(synth){loadV();synth.onvoiceschanged=loadV;}else{document.getElementById('warn').style.display='block';}
function pick(l){if(!voices.length)loadV();return voices.find(v=>v.lang===l)||voices.find(v=>v.lang&&v.lang.slice(0,2)===l.slice(0,2))||null;}
let playing=false,looping=false,queue=[],cur=null,curCards=[],gapTimer=null,wordCard=null,wordAudio=null;
// Native grup seslendirme eklentisi (varsa): kuyruk + döngü + ekran-kapalı okuma native tarafta.
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
// Eklenti nesnesi: Capacitor'un sayfaya enjekte ettiği Capacitor.Plugins.GroupTts (@capacitor/core
// paketlenmediği için registerPlugin YOK — eskiden yalnız ona bakıldığından native okuma hiç çalışmıyordu).
const GT=NATIVE?((window.Capacitor.Plugins&&Capacitor.Plugins.GroupTts)||(typeof Capacitor.registerPlugin==='function'&&Capacitor.registerPlugin('GroupTts'))||null):null;
function clr(){if(cur){cur.classList.remove('playing');cur=null;}}
function clrWord(){if(wordCard){wordCard.classList.remove('playing');wordCard=null;}}
// Geçici teşhis balonu: Cambridge sesi neden gelmedi görünsün.
let toastEl=null,toastTimer=null;
function toast(msg){if(!toastEl){toastEl=document.createElement('div');toastEl.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1B2430;color:#fff;font-size:12px;padding:8px 14px;border-radius:20px;z-index:9999;max-width:90%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:opacity .3s;pointer-events:none';document.body.appendChild(toastEl);}toastEl.textContent=msg;toastEl.style.opacity='1';if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>{if(toastEl)toastEl.style.opacity='0';},4000);}
// Kalıcı teşhis çubuğu (üstte, dokununca kapanır). Toast'tan daha görünür.
let diagEl=null;
function diag(msg,act){if(!diagEl){diagEl=document.createElement('div');diagEl.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:#8A2A1E;color:#fff;font-size:13px;font-weight:600;padding:12px 14px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.35);line-height:1.4';diagEl.onclick=()=>{diagEl.style.display='none';};document.body.appendChild(diagEl);}diagEl.innerHTML='';const t=document.createElement('span');t.textContent='🔎 '+msg+'  (kapatmak için dokun)';diagEl.appendChild(t);
  if(act){const b=document.createElement('button');b.textContent=act.label;b.style.cssText='display:block;margin-top:9px;border:0;border-radius:9px;background:#fff;color:#8A2A1E;font-weight:800;font-size:13px;padding:9px 14px';
    b.onclick=e=>{e.stopPropagation();diagEl.style.display='none';try{act.fn();}catch(_){}};diagEl.appendChild(b);}
  diagEl.style.display='block';}
function diagClear(){if(diagEl)diagEl.style.display='none';}
// Okunan kart: kelimeye göre bulunur (sayfa yenilense de doğru kart işaretlensin).
function cardOf(w,i){if(w){const c=[...document.querySelectorAll('.card')].find(x=>x.dataset.w===w);if(c)return c;}
  return (i!=null&&i>=0&&i<curCards.length)?curCards[i]:null;}
function markCard(w,i,scroll){clr();const c=cardOf(w,i);if(!c)return;cur=c;c.classList.add('playing');
  if(scroll&&!document.hidden)c.scrollIntoView({behavior:'smooth',block:'center'});}
let nativeOn=false;   // okuma telefondaki hizmette sürüyor (sayfadan bağımsız, Spotify gibi)
if(GT&&GT.addListener){
  // Her kelime başında native olay → okunan kartı vurgula ve ona kaydır.
  GT.addListener('wordStart',ev=>{if(!ev)return;nativeOn=true;if(!playing){playing=true;setPlayBtns();}markCard(ev.word,ev.index,true);});
  // Duraklat/devam/kapat (bildirim, kulaklık, kilit ekranı) → düğme durumu.
  GT.addListener('state',ev=>{if(!ev)return;if(ev.active){nativeOn=true;playing=true;}else{nativeOn=false;playing=false;clr();}setPlayBtns();
    if(ev.active&&!ev.paused&&gapPending)applyGapLive();});
  // Döngü kapalıyken liste bitince.
  GT.addListener('done',()=>{nativeOn=false;playing=false;looping=false;clr();setPlayBtns();});
  // Servisten hata → kalıcı çubuk; bildirimler kapalıysa "Bildirimleri aç" düğmesi.
  GT.addListener('ttsError',ev=>{const m=(ev&&ev.msg)?ev.msg:'Ses/bildirim hatası';OXLOG.add('okuma_hata',{m:m});
    diag(m,(/Bildirim KAPALI/.test(m)&&typeof GT.openNotificationSettings==='function')?{label:'Bildirimleri aç',fn:()=>GT.openNotificationSettings()}:null);});
}
// Hizmetin durumunu sor: sayfa açılınca / uygulamaya dönünce düğme ve işaret doğru olsun.
function syncNative(scroll){if(!GT||typeof GT.getState!=='function')return;
  Promise.resolve(GT.getState()).then(st=>{
    if(st&&st.active){nativeOn=true;playing=true;markCard(st.word,st.index,scroll);}
    else if(nativeOn){nativeOn=false;playing=false;clr();}
    setPlayBtns();}).catch(()=>{});}
window.addEventListener('oxTtsOpen',()=>syncNative(true));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNative(false);});
function setPlayBtns(){const p=document.getElementById('playall');
  p.textContent=playing?"■ Durdur":"▶ Listeyi oku";p.classList.toggle('stop',playing);}
function speak(t,card,after){if(!synth)return;const u=new SpeechSynthesisUtterance(t);const v=pick(LANG);if(v)u.voice=v;u.lang=LANG;u.rate=RATE;if(card){clr();cur=card;card.classList.add('playing');}u.onend=()=>{if(card)card.classList.remove('playing');if(after)after();};u.onerror=u.onend;synth.speak(u);}
function slugOf(w){var b=w.replace(/\(.*?\)/g,'').split(',')[0];return b.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
// Bir mp3 (yerel/uzak) çal; oynatma başlarsa true, hata olursa false döner.
function playAudioUrl(url,card){return new Promise(res=>{
  try{if(wordAudio){wordAudio.pause();wordAudio=null;}}catch(e){}
  clrWord();if(card){wordCard=card;card.classList.add('playing');card.scrollIntoView({behavior:'smooth',block:'center'});}
  const a=new Audio(url);wordAudio=a;let done=false;const ok=()=>{if(!done){done=true;res(true);}};
  a.addEventListener('playing',ok);a.onended=()=>clrWord();a.onerror=()=>{if(!done){done=true;clrWord();res(false);}};
  a.play().then(ok).catch(()=>{if(!done){done=true;clrWord();res(false);}});
});}
// Tek kelime 🔊: 1) uygulamaya gömülü Cambridge sesi (offline) → 2) cihaz sesi.
async function one(t,card){
  if(synth)synth.cancel();stop();
  try{if(await playAudioUrl('audio/'+slugOf(t)+'.mp3',card))return;}catch(e){}
  speak(t,card);
}
// stopLocal: yalnız sayfadaki sesi durdurur (telefondaki okuma sürer). stop: okumayı da kapatır.
function stopLocal(){playing=false;looping=false;queue=[];if(gapTimer){clearTimeout(gapTimer);gapTimer=null;}try{if(wordAudio){wordAudio.pause();wordAudio=null;}}catch(e){}clrWord();if(synth)synth.cancel();clr();setPlayBtns();}
function stop(){nativeOn=false;if(GT){try{const r=GT.stop();if(r&&r.catch)r.catch(()=>{});}catch(e){}}stopLocal();}
// Türkçe okuma metni: parantez içi atılır, ";" virgül olur, ek tiresi okunmaz ("-den" → "den").
function trSay(t){return String(t||'').replace(/\([^)]*\)/g,' ').replace(/;/g,',').replace(/(^|[\s,])-+/g,'$1').replace(/\s+,/g,',').replace(/\s+/g,' ').replace(/^[\s,]+|[\s,]+$/g,'');}
// Listeyi oku. Döngü ve Türkçe okuma Ayarlar'dan (döngü varsayılan açık). GAP: kelimeler arası bekleme (ms).
// startWord: verilirse okuma o kelimeden başlar (bekleme değişince kaldığı yerden sürmek için).
function readGroup(startWord){const loop=!!SRS.opt('loop',true),readTr=!!SRS.opt('readTr',false);
  const cs=[...document.querySelectorAll('.card')].filter(c=>c.style.display!=='none');if(!cs.length)return;
  let start=0;if(startWord){const j=cs.findIndex(c=>c.dataset.w===startWord);if(j>0)start=j;}
  playing=true;looping=loop;setPlayBtns();
  if(GT&&GT.speakGroup){   // NATIVE: gömülü mp3 kuyruğu + servis (bildirim/kulaklık)
    diagClear();curCards=cs;if(synth)synth.cancel();nativeOn=true;
    OXLOG.add('okuma',{mod:'native',n:cs.length,dongu:loop?1:0,tr:readTr?1:0});
    const es=cs.map(c=>BYK[c.dataset.k]);
    try{
      const r=GT.speakGroup({words:cs.map(c=>c.dataset.w),slugs:cs.map(c=>slugOf(c.dataset.w)),
        trs:es.map(e=>e?(e.d.tr||''):''),says:es.map(e=>e?trSay(e.d.tr):''),levels:es.map(e=>e?e.g.level:''),
        rate:RATE,loop:loop,readTr:readTr,gap:GAP,start:start});
      if(r&&r.catch)r.catch(e=>diag('speakGroup reddedildi: '+(e&&e.message?e.message:JSON.stringify(e))));
    }catch(e){diag('speakGroup istisna: '+e);}
    return;
  }
  // Buraya düşerse native eklenti YOK → ses web üzerinden çalar; bildirim/kulaklık bu modda olmaz.
  diag('Native eklenti çalışmıyor (GT yok) — ses web modunda; bildirim/kulaklık bu yüzden yok.');OXLOG.add('okuma',{mod:'web',n:cs.length});
  // TARAYICI (fallback): her kelimede önce gömülü mp3, yoksa TTS; sonra GAP bekle.
  if(!synth){stop();return;}
  synth.cancel();
  let i=start;
  (async function next(){
    if(!playing)return;
    if(i>=cs.length){if(looping){i=0;}else{stop();return;}}
    const card=cs[i],w=cs[i].dataset.w;clr();cur=card;card.classList.add('playing');card.scrollIntoView({behavior:'smooth',block:'center'});
    const advance=()=>{if(!playing)return;i++;if(GAP>0){gapTimer=setTimeout(next,GAP);}else next();};
    // İngilizceden sonra (ayar açıksa) Türkçesi.
    const afterEn=()=>{if(!playing)return;const e=BYK[card.dataset.k],say=(readTr&&e&&synth)?trSay(e.d.tr):'';
      if(!say){advance();return;}
      gapTimer=setTimeout(()=>{if(!playing)return;const u=new SpeechSynthesisUtterance(say);const v=pick('tr-TR');if(v)u.voice=v;u.lang='tr-TR';u.rate=RATE;u.onend=advance;u.onerror=advance;synth.speak(u);},400);};
    let played=false;
    try{played=await playAudioUrl('audio/'+slugOf(w)+'.mp3',null);}catch(e){}
    if(played){if(wordAudio){wordAudio.onended=afterEn;wordAudio.onerror=afterEn;}else afterEn();return;}
    const u=new SpeechSynthesisUtterance(w);const v=pick(LANG);if(v)u.voice=v;u.lang=LANG;u.rate=RATE;
    u.onend=afterEn;u.onerror=afterEn;synth.speak(u);
  })();}

// Başlık: döngüdeki kelime sayısı · listedeki en yüksek seviye.
function setSecLabel(){const lv=SRS.topLevel();
  document.getElementById('seclabel').textContent=SRS.inCycle()+(lv?' · '+lv:'');}
// Havai fişek: koyu panelde roketler yükselip patlar (~7 sn), ortada OLMİŞDUR. Dokununca tekrar.
let celeRaf=0;
function celebrate(list){
  list.innerHTML='<div class="cele"><canvas></canvas><div class="olm">OLMİŞDUR</div></div>';
  const box=list.firstChild,cv=box.querySelector('canvas'),ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,3);
  let W=0,H=0,parts=[],rockets=[],t0=0,last=0;
  function size(){W=box.clientWidth;H=box.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  function launch(){rockets.push({x:W*(.15+Math.random()*.7),y:H,vy:-(H*.018+Math.random()*H*.006),ty:H*(.15+Math.random()*.35),h:Math.random()*360});}
  function burst(r){const n=60+(Math.random()*40|0);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=1+Math.random()*3.6;
    parts.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,h:r.h+Math.random()*40-20});}}
  function frame(t){
    if(!t0){t0=t;last=t;}
    if(t-t0<7000&&t-last>420+Math.random()*300){launch();if(Math.random()<.35)launch();last=t;}
    ctx.fillStyle='rgba(20,27,38,.22)';ctx.fillRect(0,0,W,H);
    rockets=rockets.filter(r=>{const y0=r.y;r.y+=r.vy;ctx.strokeStyle='hsl('+r.h+',90%,75%)';ctx.lineWidth=2;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(r.x,y0);ctx.lineTo(r.x,r.y);ctx.stroke();if(r.y<=r.ty){burst(r);return false;}return true;});
    parts=parts.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.985;p.vy*=.985;p.l-=.012;
      if(p.l<=0)return false;ctx.globalAlpha=p.l;ctx.fillStyle='hsl('+p.h+',95%,62%)';ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,7);ctx.fill();ctx.globalAlpha=1;return true;});
    if(t-t0<7000||rockets.length||parts.length)celeRaf=requestAnimationFrame(frame);
    else{ctx.clearRect(0,0,W,H);}
  }
  size();cancelAnimationFrame(celeRaf);celeRaf=requestAnimationFrame(frame);
  box.onclick=()=>{cancelAnimationFrame(celeRaf);t0=0;parts=[];rockets=[];ctx.clearRect(0,0,W,H);celeRaf=requestAnimationFrame(frame);};
}
// Yeni kelime listesi (ayarlardaki sayı kadar), sınavın soracağı sırayla.
// Sınavda cevaplanan kelime listeden düşer, alttan sıradaki eklenir.
const FORCE_CELE=(()=>{try{return new URLSearchParams(location.search).get('kutla')==='1';}catch(e){return false;}})();
function renderList(){stopLocal();cancelAnimationFrame(celeRaf);const list=document.getElementById('list');list.innerHTML='';
const keys=SRS.newList(SRS.listSize());
const cele=!keys.length||FORCE_CELE;
document.querySelector('header .controls').style.display=cele?'none':'';document.getElementById('search').style.display=cele?'none':'';
if(cele){celebrate(list);return;}
keys.forEach(k=>{const e=BYK[k];if(!e)return;const d=e.d;
const c=document.createElement('div');c.className='card';c.style.borderLeftColor=SColor[d.sec]||'var(--diger)';c.dataset.w=d.w;c.dataset.k=k;c.dataset.s=(d.w+' '+(d.tr||'')).toLowerCase();
c.innerHTML=`<div class="row1"><span class="word">${d.w}</span><span class="tag">${posTag[d.pos]||''} · ${e.g.level}</span></div>

// Bekleme sürgüsü: değer saklanır; okuma sürerken değişince HEMEN uygulanır.
function setGap(v){GAP=Math.round(parseFloat(v)*1000);}
const gapEl=document.getElementById('gap');
{const g=parseFloat(SRS.opt('gap',0.5));if(g>=0&&g<=3)gapEl.value=String(g);}
setGap(gapEl.value);
let gapT=0,gapPending=false;
gapEl.addEventListener('input',e=>{setGap(e.target.value);SRS.setOpt('gap',parseFloat(e.target.value));
  clearTimeout(gapT);gapT=setTimeout(()=>{applyGapLive();OXLOG.add('ayar',{bekleme:GAP});},400);});
// Telefondaki okumaya yeni beklemeyi uygula: destekliyorsa doğrudan (setGap), değilse
// okunan kelimeden yeniden başlat. Eski APK'da (getState yok) bir sonraki başlatmada geçerli olur.
function applyGapLive(){
  if(!GT||!nativeOn)return;
  if(typeof GT.setGap==='function'){try{const r=GT.setGap({gap:GAP});if(r&&r.catch)r.catch(()=>{});}catch(e){}return;}
  if(typeof GT.getState!=='function')return;
  Promise.resolve(GT.getState()).then(st=>{if(!st||!st.active)return;
    if(st.paused){gapPending=true;return;}   // duraklatılmışsa devam edince uygula
    gapPending=false;readGroup(st.word);}).catch(()=>{});
}
