name: Android APK derle

# YAYIN: main dalına giren her değişiklikte APK'yı ve uygulama içi güncelleme paketini
# (web.json + web-version.txt) derleyip apk-latest release'ine koyar. Telefonlardaki
# güncelleyici paketi YALNIZ oradan indirir. Testler, doğrulama ya da bekçi kırmızıysa
# hiçbir şey yayınlanmaz. Elle: Actions > "Android APK derle" > Run workflow (main seçili).
# PR'larda yalnız DENEME: APK mühürsüz derlenir (derleniyor mu?), hiçbir şey yayınlanmaz.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "templates/**"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "templates/**"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"

# Aynı anda iki yayın olmasın (sonraki, öncekinin bitmesini bekler). PR denemeleri ayrı sırada.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deneme-{0}', github.ref) || 'yayin' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Yalnız main'den yayın
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Yayın yalnız main dalından yapılır (şu an: ${{ github.ref_name }})."
          exit 1

      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # İmza anahtarı repoda değil: GitHub → Settings → Secrets and variables → Actions'taki
      # IMZA_ANAHTARI (base64 PKCS12) ve IMZA_PAROLA'dan açılır. Yoksa yayın yapılmaz (yanlış
      # anahtarla imzalı APK telefondakinin üstüne kurulamaz).
      - name: İmza anahtarını hazırla
        if: github.event_name != 'pull_request'
        env:
          IMZA_ANAHTARI: ${{ secrets.IMZA_ANAHTARI }}
          IMZA_PAROLA: ${{ secrets.IMZA_PAROLA }}
        run: |
          if [ -z "$IMZA_ANAHTARI" ] || [ -z "$IMZA_PAROLA" ]; then
            echo "::error::IMZA_ANAHTARI / IMZA_PAROLA gizli ayarları yok; yayın yapılmadı."
            exit 1
          fi
          printf '%s' "$IMZA_ANAHTARI" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/imza.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/imza.p12" -storepass "$IMZA_PAROLA" -alias oxford > /dev/null \
            || { echo "::error::İmza anahtarı açılamadı (gizli ayar eksik/yanlış kopyalanmış olabilir)."; exit 1; }
          echo "IMZA_DOSYASI=$RUNNER_TEMP/imza.p12" >> "$GITHUB_ENV"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          # Eylül 2025'te Google eski "tools" paketini depodan kaldırdı; action'ın
          # varsayılanı onu kurmaya çalışıp patlıyordu. Boş bırakıyoruz; gerekli
          # paketleri aşağıdaki adım (platform-tools / android-34 / build-tools) kurar.
          packages: ""

      - name: Gerekli SDK paketlerini yükle
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            yes | sdkmanager --licenses > /tmp/sdk.log 2>&1 || true
            if sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >> /tmp/sdk.log 2>&1; then
              ok=1; break
            fi
            echo "sdkmanager denemesi $i başarısız — tekrar deneniyor..." | tee -a /tmp/sdk.log
            sleep $((i * 10))
          done
          tail -n 40 /tmp/sdk.log || true
          [ "$ok" = "1" ] || { echo "SDK paketleri 5 denemede kurulamadı"; exit 1; }

      - name: Testler
        run: |
          TZ=Europe/Istanbul node tests/srs.test.js
          node tests/updater.test.js
          node tests/hesap.test.js

      - name: Veri doğrulama
        run: python3 scripts/validate.py

      # Bekçi kırmızıysa APK ve güncelleme paketi yayınlanmaz (kurallar: CLAUDE.md).
      - name: Bekçi
        run: python3 scripts/bekci.py

      # Sayfalar + updater.js (yeni sürüm numarasıyla) + web.json + web-version.txt.
      # APK'ya giren app/www ile release'e giden paket böylece aynı derlemeden çıkar.
      - name: Sayfaları ve güncelleme paketini üret
        run: python3 scripts/build_all.py

      - name: Bağımlılıkları kur (npm ci)
        working-directory: app
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci denemesi $i başarısız, tekrar..."; sleep $((i * 10))
          done

      - name: Web varlıklarını senkronla (cap sync)
        working-directory: app
        run: npx cap sync android 2>&1 | tee /tmp/capsync.log

      # Yayın (release) derlemesi: hata ayıklanamaz — USB ile bağlanan biri uygulamanın verisini
      # (ilerleme, kurtarma kodu) okuyamaz, WebView uzaktan incelenemez.
      - name: APK derle (release)
        working-directory: app/android
        env:
          IMZA_PAROLA: ${{ secrets.IMZA_PAROLA }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: "Deneme: APK hata ayıklanamaz mı"
        if: github.event_name == 'pull_request'
        run: |
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -n 1)
          apk=$(ls app/android/app/build/outputs/apk/release/*.apk | head -n 1)
          "$aapt" dump badging "$apk" | grep -E "^package:"
          if "$aapt" dump badging "$apk" | grep -q "application-debuggable"; then
            echo "::error::APK hata ayıklanabilir (debuggable) derlenmiş"; exit 1
          fi

      - name: Hata logunu topla (teşhis)
        if: failure()
        run: |
          {
            echo "===== SDK paketleri (son 60) ====="
            tail -n 60 /tmp/sdk.log 2>/dev/null || echo "sdk.log yok"
            echo
            echo "===== cap sync (son 40) ====="
            tail -n 40 /tmp/capsync.log 2>/dev/null || echo "capsync.log yok → cap sync'e gelinmedi"
            echo
            echo "===== gradle (son 250) ====="
            tail -n 250 /tmp/gradle.log 2>/dev/null || echo "gradle.log yok → gradle'a gelinmedi"
          } > ci-error.log
          echo "log boyutu: $(wc -c < ci-error.log) bayt"

      - name: Hata logunu artifact olarak yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-error-log
          path: ci-error.log
          if-no-files-found: warn

      - name: APK'yı artifact olarak yükle
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: thousand-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: APK'yı sabit adlandır
        if: github.event_name != 'pull_request'
        run: cp app/android/app/build/outputs/apk/release/app-release.apk Thousand.apk

      # APK gerçekten yeni anahtarla mı imzalandı? (Yanlış imzalı APK yayınlanmasın.)
      - name: İmzayı doğrula
        if: github.event_name != 'pull_request'
        env:
          IMZA_PAROLA: ${{ secrets.IMZA_PAROLA }}
        run: |
          beklenen=$(keytool -list -storetype PKCS12 -keystore "$IMZA_DOSYASI" -storepass "$IMZA_PAROLA" -alias oxford | grep -o 'SHA-256): .*' | cut -d' ' -f2)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n 1)
          gercek=$("$apksigner" verify --print-certs Thousand.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "beklenen: $beklenen"; echo "APK:      $gercek"
          [ "$(echo "$beklenen" | tr -d ':' | tr 'A-F' 'a-f')" = "$gercek" ] || { echo "::error::APK yanlış anahtarla imzalı"; exit 1; }
          # Hata ayıklanabilir APK yayınlanmasın; sürüm numarası da yazılsın.
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -n 1)
          "$aapt" dump badging Thousand.apk | grep -E "^package:" 
          if "$aapt" dump badging Thousand.apk | grep -q "application-debuggable"; then
            echo "::error::APK hata ayıklanabilir (debuggable) derlenmiş"; exit 1
          fi

      - name: Release olarak yayınla (apk-latest)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Thousand — son APK"
          prerelease: true
          # web.json + web-version.txt: uygulama içi güncelleme paketi (APK'yı tekrar
          # kurmadan arayüzü günceller). Yukarıda build_all.py üretti; repoda tutulmaz.
          files: |
            Thousand.apk
            web.json
            web-version.txt
          body: |
            main dalından otomatik derlenen APK (main'e her birleşmede güncellenir).
            Telefona kurmak için: indir → aç → "bilinmeyen kaynaklara izin ver".

      # Yayın aracı eski dosyaları silmez: adı değişen ya da artık üretilmeyen dosyalar (ör. eski
      # Oxford3000.apk) release sayfasında kalıp yanlışlıkla indirilmesin. Yeni dosyalar yüklendikten
      # SONRA silinir, böylece sayfada hiçbir an APK'sız kalınmaz.
      - name: Release'teki eski dosyaları temizle
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in $(gh release view apk-latest --json assets -q '.assets[].name'); do
            case "$a" in
              Thousand.apk|web.json|web-version.txt) ;;
              *) echo "siliniyor: $a"; gh release delete-asset apk-latest "$a" -y ;;
            esac
          done
