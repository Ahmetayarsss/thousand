name: Android APK derle

# Oxford 3000 uygulamasını (app/) GitHub sunucularında derler ve
# imzalı debug APK'sını indirilebilir bir artifact olarak yükler.
# Elle çalıştırmak için: Actions sekmesi > "Android APK derle" > Run workflow.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/oxford-3000-pronunciation-defs-inzs33
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gerekli SDK paketlerini yükle
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            if sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"; then
              ok=1; break
            fi
            echo "sdkmanager denemesi $i başarısız — ağ hatası olabilir, tekrar deneniyor..."
            sleep $((i * 10))
          done
          [ "$ok" = "1" ] || { echo "SDK paketleri 5 denemede kurulamadı"; exit 1; }

      - name: Bağımlılıkları kur (npm ci)
        working-directory: app
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci denemesi $i başarısız, tekrar..."; sleep $((i * 10))
          done

      - name: Web varlıklarını senkronla (cap sync)
        working-directory: app
        run: npx cap sync android

      - name: Debug APK derle
        working-directory: app/android
        run: |
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon --stacktrace && exit 0
            echo "gradle denemesi $i başarısız — ağ/geçici hata olabilir, tekrar..."
            sleep $((i * 15))
          done
          echo "gradle 3 denemede de başarısız"; exit 1

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: oxford3000-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: APK'yı sabit adlandır
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk Oxford3000.apk

      - name: Release olarak yayınla (apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Oxford 3000 — son APK"
          prerelease: true
          files: Oxford3000.apk
          body: |
            Otomatik derlenen debug APK (her push'ta güncellenir).
            Telefona kurmak için: indir → aç → "bilinmeyen kaynaklara izin ver".
