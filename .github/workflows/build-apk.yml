name: Android APK derle

# Oxford 3000 uygulamasını (app/) GitHub sunucularında derler ve
# imzalı debug APK'sını indirilebilir bir artifact olarak yükler.
# Elle çalıştırmak için: Actions sekmesi > "Android APK derle" > Run workflow.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/oxford-3000-pronunciation-defs-inzs33
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: claude/oxford-3000-pronunciation-defs-inzs33

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          # Eylül 2025'te Google eski "tools" paketini depodan kaldırdı; action'ın
          # varsayılanı onu kurmaya çalışıp patlıyordu. Boş bırakıyoruz; gerekli
          # paketleri aşağıdaki adım (platform-tools / android-34 / build-tools) kurar.
          packages: ""

      - name: Gerekli SDK paketlerini yükle
        run: |
          ok=0
          for i in 1 2 3 4 5; do
            yes | sdkmanager --licenses > /tmp/sdk.log 2>&1 || true
            if sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >> /tmp/sdk.log 2>&1; then
              ok=1; break
            fi
            echo "sdkmanager denemesi $i başarısız — tekrar deneniyor..." | tee -a /tmp/sdk.log
            sleep $((i * 10))
          done
          tail -n 40 /tmp/sdk.log || true
          [ "$ok" = "1" ] || { echo "SDK paketleri 5 denemede kurulamadı"; exit 1; }

      - name: Bağımlılıkları kur (npm ci)
        working-directory: app
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci denemesi $i başarısız, tekrar..."; sleep $((i * 10))
          done

      - name: Web varlıklarını senkronla (cap sync)
        working-directory: app
        run: npx cap sync android 2>&1 | tee /tmp/capsync.log

      - name: Debug APK derle
        working-directory: app/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Hata logunu depoya yaz (teşhis)
        if: failure()
        run: |
          {
            echo "===== SDK paketleri (son 60) ====="
            tail -n 60 /tmp/sdk.log 2>/dev/null || echo "sdk.log yok"
            echo
            echo "===== cap sync (son 40) ====="
            tail -n 40 /tmp/capsync.log 2>/dev/null || echo "capsync.log yok → cap sync'e gelinmedi"
            echo
            echo "===== gradle (son 250) ====="
            tail -n 250 /tmp/gradle.log 2>/dev/null || echo "gradle.log yok → gradle'a gelinmedi"
          } > ci-error.log
          echo "log boyutu: $(wc -c < ci-error.log) bayt"
          BR=claude/oxford-3000-pronunciation-defs-inzs33
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f ci-error.log
          git commit -m "CI teşhis logu" || echo "commit yok"
          for i in 1 2 3 4 5; do
            git push origin "HEAD:$BR" && break
            echo "push $i başarısız, güncelle"; git fetch origin "$BR"; git rebase "origin/$BR" || git rebase --abort; sleep 4
          done

      - name: Log'u artifact olarak da yükle (yedek)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-error-log
          path: ci-error.log
          if-no-files-found: warn

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: oxford3000-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: APK'yı sabit adlandır
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk Oxford3000.apk

      - name: Web güncelleme paketini üret (web.json)
        run: |
          python3 - <<'PY'
          import json, os
          base = "app/www"
          names = ["index.html","kartlar.html","sozluk.html","istatistik.html","tts-bridge.js","progress.js","updater.js"]
          d = {}
          for n in names:
              p = os.path.join(base, n)
              if os.path.exists(p):
                  with open(p, encoding="utf-8") as f:
                      d[n] = f.read()
          with open("web.json", "w", encoding="utf-8") as f:
              json.dump(d, f, ensure_ascii=False)
          print("web.json:", os.path.getsize("web.json"), "bayt,", len(d), "dosya")
          PY

      - name: Release olarak yayınla (apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Oxford 3000 — son APK"
          prerelease: true
          # web.json.gz + web-version.txt: uygulama içi güncelleme paketi (APK'yı
          # tekrar kurmadan arayüzü günceller). build_all.py üretir, repoda tutulur.
          files: |
            Oxford3000.apk
            web.json
            web-version.txt
          body: |
            Otomatik derlenen debug APK (her push'ta güncellenir).
            Telefona kurmak için: indir → aç → "bilinmeyen kaynaklara izin ver".
