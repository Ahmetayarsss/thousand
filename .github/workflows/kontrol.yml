name: Kontrol

# Her push ve PR'da: testler, veri doğrulama, bekçi (gizli bilgi, sabit dal adı, izinsiz ağ
# adresi, ölü dosya, belge kayması, paket tutarlılığı) ve üretilen dosyaların güncelliği.
# Kurallar: CLAUDE.md. Bilinen borçlar: scripts/bekci_borc.json.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Testler
        run: |
          TZ=Europe/Istanbul node tests/srs.test.js
          node tests/updater.test.js
          node tests/hesap.test.js
          node tests/log.test.js
          TZ=Europe/Istanbul node tests/oturum.test.js
          TZ=Europe/Istanbul node tests/ilerleme.test.js
          node tests/sozluk.test.js
          node tests/cevirme.test.js
          bash tests/sunucu.test.sh

      - name: Veri doğrulama
        run: python3 scripts/validate.py

      - name: Bekçi
        run: python3 scripts/bekci.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Yeni uygulama (mobile/, PLAN.md Aşama 9): bağımlılıklar kurulup Android paketi derlenebiliyor mu.
      - name: Yeni uygulama paketleniyor mu
        working-directory: mobile
        run: |
          npm ci
          npx expo export --platform android --output-dir "$RUNNER_TEMP/mobil-paket" > "$RUNNER_TEMP/mobil.log" 2>&1 \
            || { grep -av '\.mp3' "$RUNNER_TEMP/mobil.log" | tail -n 60; exit 1; }

      - name: Üretilen dosyalar şablonlarla güncel mi
        run: |
          python3 scripts/build_all.py > /dev/null
          # Güncelleme paketi (web.json, web-version.txt, app/www/updater.js) repoda değil; geri kalanında fark olmamalı.
          if ! git diff --exit-code --stat; then
            echo "::error::Üretilen dosyalar commit'lenenden farklı. 'python3 scripts/build_all.py' çalıştırıp sonucu commit'le; app/www'daki üretilen sayfaları elle düzenleme."
            exit 1
          fi
