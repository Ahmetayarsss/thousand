name: Cambridge sesleri (ilk gruplar) uygulamaya göm

# scripts/fetch_cambridge_audio.py'yi runner'da (açık internet) çalıştırır:
# Grup 1-2 (ilk 200 kelime) için Cambridge US mp3'lerini indirip app/www/audio/
# altına koyar ve depoya işler. Bu klasör APK'ya gömülür → offline gerçek insan sesi.

on:
  workflow_dispatch:
    inputs:
      groups:
        description: "Hangi gruplar (boşlukla): örn '1 2'"
        default: "1 2"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: claude/oxford-3000-pronunciation-defs-inzs33

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cambridge US seslerini çek
        run: python3 scripts/fetch_cambridge_audio.py ${{ github.event.inputs.groups }}

      - name: Kaç dosya indi
        run: |
          echo "Toplam mp3: $(ls -1 app/www/audio/*.mp3 2>/dev/null | wc -l)"
          du -sh app/www/audio 2>/dev/null || true

      - name: Depoya işle (çakışmaya dayanıklı)
        run: |
          BR=claude/oxford-3000-pronunciation-defs-inzs33
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app/www/audio
          git commit -m "Grup ${{ github.event.inputs.groups }} Cambridge US sesleri (uygulamaya gömüldü)" || { echo "değişiklik yok"; exit 0; }
          ok=0
          for i in 1 2 3 4 5 6; do
            git fetch origin "$BR" || true
            # yeni sesleri, uzağın en güncel ucunun ÜSTÜNE taşı (rebase); çakışırsa reset+recommit
            git rebase "origin/$BR" || { git rebase --abort || true; git reset --soft "origin/$BR"; git add app/www/audio; git commit -m "Grup ${{ github.event.inputs.groups }} Cambridge US sesleri (uygulamaya gömüldü)" || true; }
            if git push origin "HEAD:$BR"; then ok=1; break; fi
            echo "push denemesi $i başarısız — dal ilerlemiş olabilir, tekrar..."; sleep 5
          done
          [ "$ok" = "1" ] || { echo "push 6 denemede de başarısız"; exit 1; }
