<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thousand · Kelime Kartları</title>
<style>
:root{--bg:#F4F6F9;--card:#fff;--ink:#1B2430;--muted:#7A8699;--line:#E6EAF1;--green:#2E9E5B;--green-d:#238049;--red:#D9544D;--red-d:#B83E38;--tr:#B03A2E;--ok:#0E8074;--accent:#3B6EA5;--speak:#E5892B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}
#app{max-width:600px;margin:0 auto;height:calc(100dvh - var(--navh,0px) - env(safe-area-inset-bottom));display:flex;flex-direction:column;padding:8px 12px 10px}   /* alt çubuğun üstünde biter */
.top{flex:0 0 auto}
.moderow{display:flex;gap:6px;background:var(--soft);border-radius:11px;padding:4px;margin:2px 0 8px}
.moderow button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:800;font-size:13.5px;padding:9px 0;border-radius:8px;cursor:pointer}
.moderow button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grouprow{display:flex;gap:7px;align-items:center}
.nav{border:0;background:var(--solid);color:var(--on-solid);font-size:15px;font-weight:800;width:34px;height:34px;border-radius:9px;cursor:pointer;flex:0 0 auto}
.nav:disabled{opacity:.35}
select{flex:1;min-width:0;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:9px;padding:8px 9px;font-size:13.5px;font-weight:600}
.acc{display:inline-flex;background:var(--soft);border-radius:8px;padding:2px;flex:0 0 auto}
.acc button{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:11.5px;padding:6px 9px;border-radius:7px;cursor:pointer}
.acc button.on{background:var(--card);color:var(--ink)}
.progline{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.bar{flex:1;height:7px;border-radius:6px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.counter{font-weight:800;color:var(--ink);flex:0 0 auto}

.stage{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding-top:8px;position:relative}
/* Deste: üst üste duran kartlar. Slot konumu/eğimi taşır; içindeki flipper çevrilir. */
.deck{flex:1 1 auto;position:relative;min-height:0;perspective:1400px;perspective-origin:50% 44%}
.slot{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .38s cubic-bezier(.22,.61,.36,1);will-change:transform}
/* flipper = 3B kap (iki yüzü taşır, döner). Yüzler (.face) kartın asıl yüzeyi. */
.flipper{position:absolute;inset:0;transform-style:preserve-3d;cursor:pointer;user-select:none;transition:transform .26s cubic-bezier(.2,.9,.3,1.2);will-change:transform}
.face{position:absolute;inset:0;background:var(--card);border:1px solid var(--face-line);border-radius:20px;box-shadow:0 8px 22px rgba(20,30,50,.14),0 1px 2px rgba(20,30,50,.09);overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
/* Çerçeve: iç içe iki dikdörtgen, arası dolu siyah (kalın bant). Saf CSS. */
.frame{position:absolute;inset:14px;pointer-events:none;
       border:5px solid var(--ink);border-radius:16px}
/* Yazı alanı: çerçevenin içinde. Düzen her kartta ve her yönde aynı: ana kelime hep aynı yükseklikte
   (üstten sabit boşluk), altında okunuş, ayraç, Türkçe anlam, örnekler. */
.content{position:absolute;inset:26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;overflow:auto}
.content .sp{flex:0 0 22%}
/* Karton kıvrılmalı fırlatma/indirme — düz plaka değil, hafif esner. */
@keyframes flR{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}
  20%{transform:translate(-4%,-2%) rotate(-5deg) scale(1.025)}
  100%{transform:translate(132%,16%) rotate(27deg) scale(.9);opacity:0}}
@keyframes flL{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}
  20%{transform:translate(4%,-2%) rotate(5deg) scale(1.025)}
  100%{transform:translate(-132%,16%) rotate(-27deg) scale(.9);opacity:0}}
@keyframes snk{0%{transform:translateY(0) scale(1) rotateX(0);opacity:1}
  28%{transform:translateY(18px) scale(.985) rotateX(14deg)}
  100%{transform:translateY(66px) scale(.84) rotateX(2deg);opacity:0}}
.slot.fl-right{animation:flR .5s cubic-bezier(.42,.03,.3,1) forwards}
.slot.fl-left{animation:flL .5s cubic-bezier(.42,.03,.3,1) forwards}
.slot.fl-sink{animation:snk .46s cubic-bezier(.5,.04,.4,1) forwards}
.lvl{position:absolute;top:2px;right:2px;font-size:11px;font-weight:800;color:#fff;background:var(--accent);border-radius:6px;padding:2px 8px}
.spk{position:absolute;top:12px;left:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--speak);color:#fff;font-size:18px;display:none;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(229,137,43,.4)}
.spk.show{display:grid}
.spk:active{transform:scale(.92)}
.q{font-size:34px;font-weight:800;letter-spacing:-.01em;line-height:1.12;color:var(--ink)}
.q.small{font-size:27px}
.q.tr{color:var(--tr)}
.sep{flex:0 0 auto;width:44px;height:3px;border-radius:2px;background:var(--sep);margin:16px 0 14px}
.tap{margin-top:18px;font-size:12px;color:var(--muted)}
.ansbox{border-top:1px dashed var(--line);margin-top:18px;padding-top:16px;width:100%}
.ok{color:var(--ok);font-weight:700;font-size:15px;margin-top:8px}
.mean{font-size:22px;font-weight:800;line-height:1.25}
.mean.tr{color:var(--tr)} .mean.en{color:var(--ink)}
.ex{color:var(--ex);font-size:14px;font-style:italic;margin-top:12px}
.controls{flex:0 0 auto;display:flex;gap:10px;margin-top:12px;min-height:52px}
.btn{flex:1;border:0;border-radius:14px;padding:16px 0;font-size:15.5px;font-weight:800;cursor:pointer;color:#fff}
.btn:active{transform:translateY(1px)}
.btn.again{background:var(--red)} .btn.know{background:var(--green)} .btn.open{background:var(--accent)}
.hidden{display:none!important}
.vh{visibility:hidden}
.leave{position:fixed;inset:0;z-index:10000;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:22px}
.leave .bx{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:22px 18px 16px;box-shadow:0 18px 50px rgba(0,0,0,.3);text-align:center}
.leave h3{margin:0 0 8px;font-size:21px;font-weight:900;color:var(--ink)}
.leave p{margin:0 0 16px;color:var(--ex);font-size:14px;line-height:1.45}
.leave .row{display:flex;gap:10px}
.leave button{flex:1;border:0;border-radius:13px;padding:14px 0;font-size:15px;font-weight:800;cursor:pointer}
.leave .stay{background:var(--solid);color:var(--on-solid)}
.leave .go{background:var(--bad-bg);color:var(--red-d)}

.result{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.score{font-size:60px;font-weight:900;letter-spacing:-.03em}
.score small{display:block;font-size:15px;font-weight:700;color:var(--muted);margin-top:2px}
.rmsg{color:var(--muted);font-size:14px;margin:10px 0 4px}
.wronglist{width:100%;max-width:420px;margin-top:14px;text-align:left;max-height:34vh;overflow:auto}
.wr{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin:6px 0;font-size:13.5px}
.wr b{color:var(--ink)} .wr span{color:var(--tr)}
.ractions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.ractions button{border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:13px;border-radius:10px;padding:11px 14px;cursor:pointer}
.ractions .prim{background:var(--solid);color:var(--on-solid);border-color:var(--solid)}
.warn{font-size:11.5px;color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:9px;padding:8px 10px;margin-top:8px;display:none}
.seclabel{flex:1;font-size:15px;font-weight:800;color:var(--ink)}
/* Sınavda kartın sol üstünde: tekrar (döngüdeki) / yeni kelime işareti. */
.mk{position:absolute;top:2px;left:2px;font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:2px 8px}
.mk.rev{background:#E5892B} .mk.new{background:#2E9E5B}
/* Yazılı kart: altın renk (destede arkadayken de) + cevap kutuları. */
.gold{position:absolute;inset:0;background:linear-gradient(150deg,#FCF1C8 0%,#F3D77E 42%,#E9C35A 68%,#F8E6A8 100%)}
.yhint{font-size:12.5px;font-weight:800;color:#8A6A12;letter-spacing:.02em}
.yhint{margin-top:16px}
/* Uygulama içi klavye (yalnız altın kartta): telefon klavyesi hiç açılmaz → kart boyutu değişmez,
   otomatik düzeltme/öneri yok. Panel destenin üstüne biner; kartlar yerinde kalır. */
.kpanel{position:absolute;left:-12px;right:-12px;bottom:calc(-10px - env(safe-area-inset-bottom));z-index:9995;background:var(--kb);border-radius:18px 18px 0 0;box-shadow:0 -6px 18px rgba(20,30,50,.18);padding:10px 5px calc(8px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tins{display:flex;gap:6px;padding:0 3px 9px}
.tin{flex:1 1 0;min-width:0;height:46px;border:2px solid #E2C463;background:#FFFBEA;border-radius:12px;padding:0 11px;font-size:17px;font-weight:700;color:var(--ink);display:flex;align-items:center;overflow:hidden;white-space:nowrap;cursor:text}
.tin.on{border-color:#C9A227;box-shadow:0 0 0 3px rgba(201,162,39,.25)}
.tin span{white-space:pre}
.tin .ph{color:#B6A266;font-weight:600;font-size:15px}
:root[data-theme=dark] .gold{background:linear-gradient(150deg,#3E3313 0%,#5E4C17 42%,#544314 68%,#3E3313 100%)}
:root[data-theme=dark] .yhint{color:#E2C463}
:root[data-theme=dark] .tin{background:#2A2410;border-color:#6B5A22}
:root[data-theme=dark] .tin .ph{color:#9C8B55}
:root[data-theme=dark] .k.fn{background:var(--key3)} :root[data-theme=dark] .k.fn.pr{background:var(--key4)}
.tin .car{flex:0 0 2px;height:22px;background:#8A6A12;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tin.good{border-color:var(--green);background:var(--good-bg)}
.tin.bad{border-color:var(--red);background:var(--bad-bg)}
.kb{display:flex;flex-direction:column;gap:7px}
.kpanel.done .kb{display:none}
.kr{display:flex;gap:4px}
.kr i{flex:.5 1 0}
.k{flex:1 1 0;min-width:0;height:44px;border:0;border-radius:7px;background:var(--key);color:var(--ink);font-size:19px;font-weight:600;font-family:inherit;padding:0;box-shadow:0 1px 0 rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.k.pr{background:var(--key2)}
.k.fn{background:#AEB9C9;font-size:15px;font-weight:800}
.k.fn.pr{background:#8E9BB0}
.k.w15{flex:1.5 1 0}
.k.sp{flex:5 1 0;font-size:13px;font-weight:700;color:var(--muted)}
.k.go{flex:3.5 1 0;background:#B8902C;color:#fff;font-size:15px;font-weight:800}
.k.go.pr{background:#977522}
.k.off{visibility:hidden}
.kpanel .btn{width:100%;margin:0 3px;width:calc(100% - 6px)}
.btn.check{background:#B8902C} .btn.check.know{background:var(--green)} .btn.check.again{background:var(--red)}
.btn:disabled{cursor:default}
.finish{flex:0 0 auto;border:0;background:var(--solid);color:var(--on-solid);font-weight:800;font-size:12px;border-radius:8px;padding:6px 12px;cursor:pointer}
</style><script src="kelimeler.js"></script><script src="log.js"></script><script src="srs.js"></script><script src="hesap.js"></script></head><body><div id="app">
<div class="top">
  <div class="moderow" id="moderow">
    <button data-m="test" class="on">Test</button>
    <button data-m="exam">Sınav</button>
  </div>
  <div class="grouprow">
    <div class="seclabel" id="seclabel"></div>
  </div>
  <div class="progline">
    <span class="bar" id="bar"></span>
    <span class="counter" id="counter"></span><button class="finish hidden" id="finish">Bitir</button>
  </div>
  <div class="warn" id="warn">İlerlemenin kaydı için dosyayı <b>tarayıcıda</b> (Chrome/Safari) aç. Sesi duymak için de tarayıcı gerekir.</div>
</div>

<div class="stage" id="stage">
  <div class="deck" id="deck"></div>
  <div class="controls" id="ctrl">
    <button class="btn open" id="open">Aç</button>
    <button class="btn again hidden" id="again"></button>
    <button class="btn know hidden" id="know"></button>
  </div>
  <div class="kpanel hidden" id="kpanel">
    <div class="tins" id="tins"></div>
    <div class="kb" id="kb"></div>
    <button class="btn check hidden" id="check">Devam</button>
  </div>
</div>

<div class="stage hidden" id="resultbox">
  <div class="result">
    <div class="score" id="score"></div>
    <div class="rmsg" id="rmsg"></div>
    <div class="wronglist" id="wronglist"></div>
    <div class="ractions">
      <button class="prim" id="r-again">Tekrar sına</button>
      <button id="r-next">Listeye dön</button>
    </div>
  </div>
</div>
</div>
<script>
// Kart için gereken alanlar (kelimeler.js'ten); örnek cümlelerdeki <b> işareti kartta gösterilmez.
const GROUPS=KELIMELER.map(g=>({no:g.no,level:g.level,lo:g.lo,hi:g.hi,
  items:g.items.map(it=>({w:it.w,tr:it.tr,ok:it.ok||'',ex:(it.ex||[]).map(s=>s.replace(/<\/?b>/g,''))}))}));
const SKEY="ox3000_sessions_v1";   // sınav oturumu kaydı (ilerleme sayfası için)
// Kelime bazlı tekrar: tüm kelimeler sırasıyla katalog; her kelimeye anahtarı (_k) ve seviyesi (_lv).
SRS.setCatalog(SRS.catalogFromGroups(GROUPS));
const BYK={};GROUPS.forEach(g=>g.items.forEach(d=>{d._lv=g.level;BYK[d._k]=d;}));
let storageOK=true;
try{localStorage.setItem("t_","1");localStorage.removeItem("t_");}catch(e){storageOK=false;}
const now=()=>Date.now();

// TTS
let LANG="en-US",voices=[];const synth=window.speechSynthesis;
function loadV(){voices=synth?synth.getVoices():[];}
if(synth){loadV();synth.onvoiceschanged=loadV;}else{document.getElementById('warn').style.display='block';}
function pick(l){if(!voices.length)loadV();return voices.find(v=>v.lang===l)||voices.find(v=>v.lang&&v.lang.slice(0,2)===l.slice(0,2))||null;}
function speak(t){if(!synth)return;synth.cancel();const u=new SpeechSynthesisUtterance(t);const v=pick(LANG);if(v)u.voice=v;u.lang=LANG;u.rate=0.85;synth.speak(u);}
// Native Sözlük sesi (varsa): 🔊 → gerçek insan sesi, yoksa cihaz TTS'i.
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
// Eklenti nesnesi: Capacitor'un sayfaya enjekte ettiği Capacitor.Plugins.GroupTts (@capacitor/core
// paketlenmediği için registerPlugin YOK — eskiden yalnız ona bakıldığından native okuma hiç çalışmıyordu).
const GT=NATIVE?((window.Capacitor.Plugins&&Capacitor.Plugins.GroupTts)||(typeof Capacitor.registerPlugin==='function'&&Capacitor.registerPlugin('GroupTts'))||null):null;
let toastEl=null,toastTimer=null;
function toast(msg){if(!toastEl){toastEl=document.createElement('div');toastEl.style.cssText='position:fixed;left:50%;bottom:calc(22px + var(--navh,0px) + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1B2430;color:#fff;font-size:12px;padding:8px 14px;border-radius:20px;z-index:9999;max-width:90%;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.3);transition:opacity .3s;pointer-events:none';document.body.appendChild(toastEl);}toastEl.textContent=msg;toastEl.style.opacity='1';
  placeToast();
  if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>{if(toastEl)toastEl.style.opacity='0';},4000);}
// Klavye paneli açıksa bilgi balonu onun üstünde durur.
function placeToast(){if(!toastEl)return;const kp=document.getElementById('kpanel');
  const alt='var(--navh,0px) + env(safe-area-inset-bottom)';   // alt gezinme çubuğunun üstü
  toastEl.style.bottom='calc('+((kp&&!kp.classList.contains('hidden')&&kp.offsetHeight)?(kp.offsetHeight+12):22)+'px + '+alt+')';}
let wordAudio=null;
function slugOf(w){var b=w.replace(/\(.*?\)/g,'').split(',')[0];return b.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function playAudioUrl(url){return new Promise(res=>{
  try{if(wordAudio){wordAudio.pause();wordAudio=null;}}catch(e){}
  const a=new Audio(url);wordAudio=a;let done=false;const ok=()=>{if(!done){done=true;res(true);}};
  a.addEventListener('playing',ok);a.onerror=()=>{if(!done){done=true;res(false);}};
  a.play().then(ok).catch(()=>{if(!done){done=true;res(false);}});
});}
// 🔊: 1) uygulamaya gömülü Sözlük sesi (offline) → 2) cihaz sesi.
async function sayWord(t){
  try{if(await playAudioUrl('audio/'+slugOf(t)+'.mp3'))return;}catch(e){}
  speak(t);}

let mode='test',cur=null,side=0;
let queue=[],testTotal=0,examList=[],examIdx=0,revCount=0,sess=null;   // examList: anahtarlar (önce tekrarlar, sonra turun yenileri)
let tPrompt=0;   // sorunun gösterildiği an (kayda cevap süresi yazılır)
const DEPTH=4;            // destede görünen kart sayısı (1 üst + 3 arka)
let slots=[],topFlip=null,busy=false;   // slots[0]=en üstteki aktif kart; busy=animasyon sürüyor

// Başlık: döngüdeki kelime sayısı · ana sayfadaki listenin en yüksek seviyesi. Her cevapta güncellenir.
function setSecLabel(){const lv=SRS.topLevel();document.getElementById('seclabel').textContent=SRS.inCycle()+(lv?' · '+lv:'');}
// Çubuk: Test'te çalışılan oranı, Sınav'da turun ilerleyişi.
function drawBar(){let p=0;
  if(mode==='test'){const t=testTotal,doneN=Math.max(0,t-testLeft());p=t?doneN/t:0;}
  else p=examList.length?Math.min(1,examIdx/examList.length):0;
  document.getElementById('bar').innerHTML=`<i style="width:${p*100}%;background:var(--green)"></i>`;}
// Test'te kalan: üstteki kart dahil (başta = listenin tamamı).
function testLeft(){return queue.length+(cur?1:0);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function dirFor(){return Math.random()<0.5?'tr2en':'en2tr';}
// Çevirme yönü: rastgele eksen (yatay Y / dikey X) + işaret → her çevirme farklı yöne.
function randAxis(){const d=[['Y',1],['Y',-1],['X',1],['X',-1]];return d[(Math.random()*4)|0];}
function tf(a,deg,sc,bend){const o=(a[0]==='Y'?'X':'Y');let r='rotate'+a[0]+'('+(deg*a[1])+'deg)';if(bend)r+=' rotate'+o+'('+bend+'deg)';return r+' scale('+sc+')';}

/* ================= DESTE (üst üste kartlar, ileriye bakışlı) ================= */
function rndTilt(){return (Math.random()*7-3.5);}   // -3.5°..3.5° hafif eğim
function rndDx(){return (Math.random()*16-8);}       // -8..8 px hafif kayma
function scaleAt(d){return 1-d*0.03;}
// Bir slotu derinliğine göre yerleştir (d=0 en üst: düz; arka kartlar küçük+aşağı+eğik).
function place(el,d){
  // Üst kart düz ve ortada (WebGL ile birebir hizalansın); arka kartlar eğik.
  const tilt=(d===0?0:(el._tilt||0)), dx=(d===0?0:(el._dx||0)), ty=d*10, sc=scaleAt(d);
  el.style.zIndex=String(DEPTH-d);
  el.style.transition='transform .38s cubic-bezier(.22,.61,.36,1)';
  el.style.transform='translate('+dx+'px,'+ty+'px) scale('+sc+') rotate('+tilt+'deg)';
}
// Çerçeve — iç içe iki dikdörtgen, arası dolu siyah bant (saf CSS).
var FRAME='<div class="frame"></div>';
function lvlTag(item){return '<span class="lvl">'+((item&&item._lv)||'')+'</span>';}
function mkTag(item){if(mode!=='exam'||!item)return '';const nw=SRS.isNew(item._k);
  return '<span class="mk '+(nw?'new':'rev')+'">'+(nw?'Yeni':'Tekrar')+'</span>';}
// Yüz içerikleri.
function goldBg(item){return isTyped(item)?'<div class="gold"></div>':'';}
function contentFront(item){
  const tr=item._dir==='tr2en',front=tr?(item.tr||'—'):item.w;
  return '<div class="content">'+mkTag(item)+lvlTag(item)+'<div class="sp"></div>'
    +'<div class="q'+((front&&front.length>16)?' small':'')+(tr?' tr':'')+'"></div>'
    +(isTyped(item)?'<div class="yhint">✎ Cevabı aşağıya yaz</div>':'')+'</div>';
}
// Arka yüz: yön ne olursa olsun hep aynı sıra — İngilizce kelime, okunuş, ayraç, Türkçe anlam, örnekler.
// Ana kelime ön yüzdeki soruyla aynı yükseklikte durur.
function contentBack(item){
  let h='<div class="content">'+mkTag(item)+lvlTag(item)+'<div class="sp"></div>'
    +'<div class="q'+(item.w.length>16?' small':'')+'">'+item.w+'</div>';
  if(item.ok)h+='<div class="ok">Okunuş: '+item.ok+'</div>';
  h+='<div class="sep"></div><div class="mean tr">'+(item.tr||'—')+'</div>';
  if(item.ex&&item.ex.length)item.ex.forEach(s=>{h+='<div class="ex">'+s+'</div>';});
  return h+'</div>';
}
// Kartı kur: iki GERÇEK yüz. Ön=soru görünür; arka=cevap (reveal'da dolar),
// 180° ön-döndürülmüş (backface-visibility ile başta gizli).
function setFront(slot,item){
  const fl=slot.querySelector('.flipper');
  fl.style.transition='none';fl.style.transform='none';fl.style.transformOrigin='center';
  if(!item){slot.style.visibility='hidden';fl.innerHTML='';slot._item=null;return;}
  slot.style.visibility='visible';slot._item=item;
  fl.innerHTML='<div class="face front">'+goldBg(item)+FRAME+contentFront(item)+'</div>'
             +'<div class="face back" style="transform:rotateX(180deg)">'+goldBg(item)+FRAME+'</div>';
  const q=fl.querySelector('.face.front .q');
  if(q)q.textContent=(item._dir==='tr2en')?(item.tr||'—'):item.w;
}
// Buton satırı: açılmadan önce tek geniş "Aç"; açıldıktan sonra iki puan butonu.
// Yazılı kartta: önce cevap kutuları + "Kontrol et", açıldıktan sonra sonuç + "Devam".
function setCtrl(revealed){
  const ty=isTyped(cur);
  document.getElementById('ctrl').classList.toggle('vh',ty);       // altında yer kaplamaya devam eder → kart boyutu hiç değişmez
  document.getElementById('kpanel').classList.toggle('hidden',!ty);
  if(ty){if(!revealed)buildTyped(cur);else typedRevealed();placeToast();return;}
  placeToast();
  document.getElementById('open').classList.toggle('hidden', revealed);
  document.getElementById('again').classList.toggle('hidden', !revealed);
  document.getElementById('know').classList.toggle('hidden', !revealed);
}
function ensureDir(item){if(item&&!item._dir)item._dir=((mode==='exam'&&SRS.dirOf(item._k))||dirFor());return item;}
// Belirli bir derinlikteki (ileriye bakış) kelime: k=0 üstteki, k>=1 arkadakiler.
function peek(k){
  if(mode==='test')return k===0?cur:(queue[k-1]||null);
  const key=examList[examIdx+k];return key?BYK[key]:null;
}
// Desteyi sıfırdan kur: ilk DEPTH kartı sıradaki kelimelerle doldur.
function buildDeck(){
  const deck=document.getElementById('deck');deck.innerHTML='';slots=[];
  for(let d=0;d<DEPTH;d++){
    const slot=document.createElement('div');slot.className='slot';
    const fl=document.createElement('div');fl.className='flipper';slot.appendChild(fl);
    slot._tilt=rndTilt();slot._dx=rndDx();deck.appendChild(slot);slots.push(slot);
  }
  for(let d=0;d<DEPTH;d++){setFront(slots[d],ensureDir(peek(d)));place(slots[d],d);}
  side=0;topFlip=slots[0].querySelector('.flipper');setCtrl(false);
  tPrompt=performance.now();refreshStatus();
}
function refreshStatus(){drawBar();const c=document.getElementById('counter');
  if(mode==='test'){c.textContent=testLeft()+' kaldı';return;}
  c.textContent=(examIdx<revCount)?'Tekrar '+(examIdx+1)+'/'+revCount:'Yeni '+(examIdx-revCount+1)+'/'+(examList.length-revCount);
}

/* ===== WebGL kavisli takla (Three.js). Kart 2D canvas'a çizilir (doku),
   alt bölümlü düzlem mesh'i vertex'lerinden eğilir → pürüzsüz bombe + tam takla.
   THREE yoksa / hata olursa false döner, çağıran DOM taklaya düşer. ===== */
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function smooth(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);}
// Sayfanın tüm <style> kuralları. foreignObject içinde :root eşleşmediği için
// değişkenleri sarmalayıcıya (.capwrap) taşırız.
var CSSCACHE=null;
function faceCSS(){
  if(CSSCACHE!=null)return CSSCACHE;
  var s='',t=document.getElementsByTagName('style');
  for(var i=0;i<t.length;i++)s+=t[i].textContent+'\n';
  CSSCACHE=s.replace(/:root/g,'.capwrap');
  return CSSCACHE;
}
// GERÇEK DOM kartını (HTML+SVG) olduğu gibi foreignObject ile dokuya yakalar.
// Elle yeniden çizim YOK → desen/yazı/renk/çözünürlük normal kartla birebir aynı.
function captureFace(innerHTML,W,H,dpr){
  return new Promise(function(res,rej){
    var dt=document.documentElement.getAttribute('data-theme');
    // Çerçeve artık SAF CSS (border/radius) → foreignObject birebir çeker, elle
    // çizime gerek yok. Yazı tipi/renk body'den miras geldiğinden açıkça veririz.
    var cs=getComputedStyle(document.body);
    var ff=(cs.fontFamily||'system-ui,sans-serif').replace(/"/g,"'");
    var col=cs.color||'#1B2430';
    var body='<div xmlns="http://www.w3.org/1999/xhtml" class="capwrap"'+(dt?' data-theme="'+dt+'"':'')
      +' style="width:'+W+'px;height:'+H+'px;position:relative;overflow:hidden;background:transparent;font-family:'+ff+';color:'+col+';-webkit-font-smoothing:antialiased">'
      +'<style>'+faceCSS()+'</style>'
      +'<div class="flipper" style="position:absolute;inset:0;transform:none">'
      +'<div class="face front" style="position:absolute;inset:0;transform:none;backface-visibility:visible;-webkit-backface-visibility:visible">'
      +innerHTML+'</div></div></div>';
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'">'
      +'<foreignObject x="0" y="0" width="'+W+'" height="'+H+'">'+body+'</foreignObject></svg>';
    var img=new Image();
    img.onload=function(){
      try{var cv=document.createElement('canvas');cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res(cv);}catch(e){rej(e);}
    };
    img.onerror=function(){rej(new Error('capture'));};
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
function mkTex(cv,maxA,back){
  var t=new THREE.CanvasTexture(cv);
  // Anizotropik mipmap: kart kıvrılınca kenarda doku sıkışsa da çizgiler net/ince
  // kalır (mipmap kapalıyken o bölge aliasing'den kalın görünüyordu).
  t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;
  t.generateMipmaps=true;t.anisotropy=maxA;
  if(back){t.wrapS=THREE.RepeatWrapping;t.repeat.x=-1;t.offset.x=1;}  // arka yüz yatay aynalanmasın
  return t;
}
var GL=null;
function glSetup(deck){
  if(GL)return GL;
  try{
    var rn=new THREE.WebGLRenderer({alpha:true,antialias:true});
    // Tüm ekranın önünde (fixed + yüksek z-index) → dönerken üst/alt barların altında kalmaz.
    var cv=rn.domElement;cv.style.cssText='position:fixed;left:0;top:0;z-index:9990;pointer-events:none;display:none';
    document.body.appendChild(cv);
    GL={rn:rn,cv:cv,sc:new THREE.Scene(),cam:new THREE.PerspectiveCamera(40,1,1,8000),grp:null,mesh:null,geo:null,base:null,raf:0};
    return GL;
  }catch(e){return null;}
}
// Kenar menteşeli açılma (gerçek kart/kapak gibi): bastığın kenar kalkar, karşı
// kenar sabit menteşe; 180° açılıp sona doğru ortaya oturur (başta/sonda hizalı).
// Dokular gerçek DOM karttan yakalandığı için fark/çözünürlük kaybı olmaz.
function glFlip(item,rx){
  if(!window.THREE)return false;
  var g=glSetup(document.getElementById('deck'));if(!g)return false;
  var fl=topFlip;
  try{
    var r=fl.getBoundingClientRect();
    var W=Math.round(r.width),H=Math.round(r.height),dpr=Math.min(window.devicePixelRatio||1,3);
    var PAD=64;   // 3B kabarma için tuval kartın dışına taşsın (kırpılmasın)
    var frontHTML=fl.querySelector('.face.front').innerHTML;   // o an görünen ön yüz
    var backHTML=goldBg(item)+FRAME+contentBack(item);
    function done(){fl.querySelector('.face.front').innerHTML=backHTML;fl.style.visibility='';g.cv.style.display='none';setCtrl(true);}
    Promise.all([captureFace(frontHTML,W,H,dpr),captureFace(backHTML,W,H,dpr)]).then(function(cvs){
      var maxA=(g.rn.capabilities.getMaxAnisotropy?g.rn.capabilities.getMaxAnisotropy():1);
      var tF=mkTex(cvs[0],maxA,false),tB=mkTex(cvs[1],maxA,true);
      var CW=W+2*PAD,CH=H+2*PAD;
      g.cv.style.left=(r.left-PAD)+'px';g.cv.style.top=(r.top-PAD)+'px';g.cv.style.width=CW+'px';g.cv.style.height=CH+'px';
      g.rn.setPixelRatio(dpr);g.rn.setSize(CW,CH,false);
      if(g.grp){g.sc.remove(g.grp);if(g.geo)g.geo.dispose();if(g.mesh)g.mesh.material.dispose();}
      g.geo=new THREE.PlaneGeometry(W,H,64,1);g.base=g.geo.attributes.position.array.slice();  // daha çok parça → pürüzsüz kavis
      var mat=new THREE.MeshBasicMaterial({map:tF,side:THREE.DoubleSide,transparent:true});
      g.mesh=new THREE.Mesh(g.geo,mat);
      var hingeLeft=(rx>=0.5),s=hingeLeft?-1:1;   // sağ'a bas → sol menteşe
      g.mesh.position.x=-s*W/2;                    // menteşe kenarı grup orijininde
      g.grp=new THREE.Group();g.grp.add(g.mesh);g.sc.add(g.grp);
      // Kamera büyütülmüş tuvali çerçeveler; W×H düzlem tam kart yerine denk gelir (pay şeffaf kalır).
      var D=(CH/2)/Math.tan(20*Math.PI/180);
      g.cam.aspect=CW/CH;g.cam.updateProjectionMatrix();g.cam.position.set(0,0,D);g.cam.lookAt(0,0,0);
      g.cv.style.display='block';fl.style.visibility='hidden';
      var N=g.geo.attributes.position.count,pos=g.geo.attributes.position.array;
      var T=650,PHI=0.75,t0=performance.now(),swapped=false;
      cancelAnimationFrame(g.raf);
      (function frame(now){
        var p=(now-t0)/T;if(p>1)p=1;
        var ease=smooth(p),ang=ease*Math.PI;
        g.grp.rotation.y=s*ang;
        var rec=smooth((p-0.5)/0.5);                 // sona doğru ortaya otur
        g.grp.position.x=s*W*(0.5-rec);
        var phi=Math.sin(p*Math.PI)*PHI;             // serbest kenar kavislenir
        if(phi<1e-4){for(var i=0;i<N*3;i++)pos[i]=g.base[i];}
        else{var R=W/phi;for(var v=0;v<N;v++){var x0=g.base[v*3];var th=(x0/W)*phi;pos[v*3]=R*Math.sin(th);pos[v*3+2]=R*Math.cos(th)-R;}}
        g.geo.attributes.position.needsUpdate=true;
        if(!swapped&&ang>=Math.PI/2){swapped=true;mat.map=tB;mat.needsUpdate=true;}
        g.rn.render(g.sc,g.cam);
        if(p<1){g.raf=requestAnimationFrame(frame);}
        else{done();tF.dispose();tB.dispose();}
      })(t0);
    }).catch(function(){done();});   // yakalama olmazsa anında cevabı göster
    return true;
  }catch(e){try{g.cv.style.display='none';fl.style.visibility='';}catch(_){}return false;}
}
// Üstteki kartı aç — GERÇEK İKİ YÜZLÜ KART, TAM TAKLA (180°). Kart yerinde döner
// (menteşe merkez), arka yüzü (cevap) öne gelir. Çok yavaş (net görülsün).
// rx,ry: dokunma yerine göre takla ekseni/yönü (dikey dokunuş→X takla, yatay→Y).
function reveal(rx,ry){
  if(side===1||busy)return;side=1;
  const fl=topFlip, back=fl.querySelector('.face.back');
  if(typeof rx!=='number')rx=0.5; if(typeof ry!=='number')ry=0.5;
  rx=Math.max(0,Math.min(1,rx));ry=Math.max(0,Math.min(1,ry));
  if(window.THREE && glFlip(cur,rx)) return;   // WebGL kenar-menteşeli açılma (olmazsa DOM taklaya düşer)
  const dx=rx-0.5, dy=ry-0.5;
  let axis,dir;
  if(Math.abs(dy)>=Math.abs(dx)){ axis='X'; dir=(dy>=0?1:-1); }  // alt/üst dokunuş → dikey takla
  else{ axis='Y'; dir=(dx>=0?-1:1); }                            // sağ/sol dokunuş → yatay dönüş
  // Arka yüzü (cevap) doldur + eksene göre 180° ön-döndür (flipper 0°'da gizli).
  back.innerHTML=goldBg(cur)+FRAME+contentBack(cur);
  back.style.transition='none'; back.style.transform='rotate'+axis+'(180deg)';
  void fl.offsetWidth;
  const faces=fl.querySelectorAll('.face');
  // FAZ 1: tam takla 0→90 — GÖLGE koyulaşır (kalkma hissi).
  fl.style.transition='transform .95s cubic-bezier(.5,.03,.6,.65)';
  fl.style.transform='rotate'+axis+'('+(dir*90)+'deg)';
  faces.forEach(f=>{f.style.transition='box-shadow .95s ease';f.style.boxShadow='0 28px 48px rgba(20,30,50,.34)';});
  setTimeout(()=>{
    // FAZ 2: 90→180 — kart oturur, gölge söner. Arka yüz (cevap) öne gelir.
    fl.style.transition='transform .95s cubic-bezier(.35,.4,.3,1)';
    fl.style.transform='rotate'+axis+'('+(dir*180)+'deg)';
    faces.forEach(f=>{f.style.boxShadow='';});
  },950);
  setTimeout(()=>{ setCtrl(true); }, 1870);
}
/* Üst kartı gönder (fırlat/indir) + arkadakileri bir öne kaydır + en alta yeni kart.
   Veri (cur/queue/examIdx) ÇAĞRIDAN ÖNCE güncellenir; peek() yeni durumu verir. */
function advanceDeck(out){
  busy=true;
  const leaving=slots[0];
  leaving.style.zIndex='60';                               // uçarken en üstte
  leaving.classList.add(out==='sink'?'fl-sink':(out==='left'?'fl-left':'fl-right'));
  for(let d=1;d<DEPTH;d++)place(slots[d],d-1);              // arkadakiler bir kademe öne
  const back=ensureDir(peek(DEPTH-1));                      // en alta girecek yeni kart
  setTimeout(()=>{
    slots.shift();
    leaving.classList.remove('fl-left','fl-right','fl-sink');
    leaving.style.transition='none';
    leaving._tilt=rndTilt();leaving._dx=rndDx();
    setFront(leaving,back);
    slots.push(leaving);void leaving.offsetWidth;place(leaving,DEPTH-1);
    busy=false;
    if(cur){side=0;topFlip=slots[0].querySelector('.flipper');setCtrl(false);tPrompt=performance.now();refreshStatus();}
    else{ mode==='test'?testDone():examDone(); }
  },470);
}

function showStage(){document.getElementById('resultbox').classList.add('hidden');document.getElementById('stage').classList.remove('hidden');}

/* ---- YAZILI KONTROL: sınav başında kuyruğun rastgele %10'u (yukarı yuvarlanır, en az 1) yazılı
   sorulur; bu kartlar altın renkli (destede arkadayken de). Kendini puanlama yok: cevabı sistem
   kontrol eder (kurallar srs.js checkTyped), doğruysa Bildim, değilse Bilemedim sayılır. ---- */
let typedSet=new Set(),tyRes=null;
let tyVals=[],tyAct=0;   // kutulardaki yazılar + etkin kutu (uygulama içi klavye; telefon klavyesi hiç açılmaz)
function isTyped(item){return mode==='exam'&&!!item&&typedSet.has(item._k);}
function typedVals(){return tyVals.slice();}
function tyLive(){return !busy&&!!cur&&isTyped(cur)&&side===0&&!tyRes;}
function updCheck(){if(tyRes)return;document.getElementById('kgo').textContent=tyVals.some(v=>v.trim())?'Kontrol et':'Bilmiyorum';}
function drawTins(){
  document.querySelectorAll('#tins .tin').forEach((d,i)=>{
    const v=tyVals[i]||'',on=!tyRes&&i===tyAct,car=()=>{const c=document.createElement('i');c.className='car';d.appendChild(c);};
    d.classList.toggle('on',on);d.textContent='';
    const t=document.createElement('span');
    if(v){t.textContent=v;d.appendChild(t);if(on)car();}
    else{if(on)car();t.className='ph';t.textContent=d.dataset.ph;d.appendChild(t);}
    d.scrollLeft=on?d.scrollWidth:0;   // yazılan kutuda son, diğerlerinde baş görünür
  });
}
function kType(ch){if(!tyLive())return;const v=tyVals[tyAct]||'';
  if(v.length>=40||(ch===' '&&(!v||v.endsWith(' '))))return;
  tyVals[tyAct]=v+ch;drawTins();updCheck();}
function kDel(){if(!tyLive())return;const v=tyVals[tyAct]||'';if(!v)return;tyVals[tyAct]=v.slice(0,-1);drawTins();updCheck();}
function kNext(){if(!tyLive()||tyVals.length<2)return;tyAct=(tyAct+1)%tyVals.length;drawTins();}
// Türkçe Q düzeni. Harfe basılır basılmaz yazar (pointerdown); ⌫ basılı tutulunca art arda siler.
const KROWS=['qwertyuıopğü','asdfghjklşi','zxcvbnmöç'];
let kDelT=0,kDelI=0;
function kUp(){clearTimeout(kDelT);clearInterval(kDelI);document.querySelectorAll('#kb .k.pr').forEach(x=>x.classList.remove('pr'));}
function buildKb(){
  const kb=document.getElementById('kb');if(kb.childElementCount)return;
  const keys=t=>[...t].map(c=>'<button class="k" data-c="'+c+'">'+c+'</button>').join('');
  kb.innerHTML='<div class="kr">'+keys(KROWS[0])+'</div>'
    +'<div class="kr"><i></i>'+keys(KROWS[1])+'<i></i></div>'
    +'<div class="kr"><i style="flex:1.5 1 0"></i>'+keys(KROWS[2])+'<button class="k fn w15" data-f="del" aria-label="Sil">⌫</button></div>'
    +'<div class="kr"><button class="k fn" style="flex:2.5 1 0" data-f="next" id="knext">Sonraki ›</button>'
    +'<button class="k sp" data-f="sp">boşluk</button><button class="k go" data-f="go" id="kgo">Kontrol et</button></div>';
  kb.addEventListener('pointerdown',e=>{
    const b=e.target.closest('.k');if(!b||b.classList.contains('off'))return;
    e.preventDefault();kUp();b.classList.add('pr');
    if(b.dataset.c)kType(b.dataset.c);
    else if(b.dataset.f==='del'){kDel();kDelT=setTimeout(()=>{kDelI=setInterval(kDel,70);},420);}
    else if(b.dataset.f==='sp')kType(' ');
    else if(b.dataset.f==='next')kNext();
    else if(b.dataset.f==='go')submitTyped();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(t=>kb.addEventListener(t,kUp));
  document.getElementById('tins').addEventListener('pointerdown',e=>{
    const d=e.target.closest('.tin');if(!d||!tyLive())return;e.preventDefault();tyAct=+d.dataset.i;drawTins();});
  // Bilgisayarda deneme için fiziksel klavye de çalışır.
  document.addEventListener('keydown',e=>{
    if(!tyLive()||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key==='Enter'){e.preventDefault();submitTyped();}
    else if(e.key==='Backspace'){e.preventDefault();kDel();}
    else if(e.key==='Tab'){e.preventDefault();kNext();}
    else if(e.key.length===1&&/[\p{L} ]/u.test(e.key)){e.preventDefault();kType(e.key.toLocaleLowerCase('tr-TR'));}
  });
}
function buildTyped(item){
  buildKb();
  const box=document.getElementById('tins'),n=SRS.answerSlots(item,item._dir).length,en=item._dir==='tr2en';
  tyVals=new Array(n).fill('');tyAct=0;tyRes=null;box.innerHTML='';
  for(let i=0;i<n;i++){const d=document.createElement('div');d.className='tin';d.dataset.i=i;
    d.dataset.ph=en?'İngilizcesi':(n>1?(i+1)+'. anlam':'Türkçesi');box.appendChild(d);}
  document.getElementById('kpanel').classList.remove('done');
  document.getElementById('knext').classList.toggle('off',n<2);
  const b=document.getElementById('check');b.className='btn check hidden';b.disabled=false;
  kUp();drawTins();updCheck();
}
function submitTyped(){
  if(!tyLive())return;
  const vals=typedVals(),r=SRS.checkTyped(cur,cur._dir,vals);
  tyRes={ok:r.ok,vals:vals};kUp();
  document.querySelectorAll('#tins .tin').forEach((x,i)=>x.classList.add(r.marks[i]?'good':'bad'));
  drawTins();document.getElementById('kpanel').classList.add('done');   // klavye iner, kutular + sonuç kalır
  const b=document.getElementById('check');b.disabled=true;b.className='btn check '+(r.ok?'know':'again');b.textContent=r.ok?'Doğru ✓':'Yanlış ✗';
  setTimeout(()=>{if(cur&&side===0){reveal(0.5,0.12);sayWord(cur.w);}},120);
}
function typedRevealed(){const b=document.getElementById('check');b.disabled=false;
  b.textContent=(tyRes&&tyRes.ok?'Doğru ✓':'Yanlış ✗')+'  ·  Devam';}

/* ---- TEST (çalışma): ana sayfadaki yeni kelimelerle serbest çalışma. İlerlemeyi değiştirmez. ---- */
function startTestFrom(order){
  mode='test';showStage();document.getElementById('finish').classList.add('hidden');
  document.getElementById('again').textContent='Tekrar';document.getElementById('know').textContent='Biliyorum';
  order.forEach(it=>{it._lockDir=false;it._dir=null;});   // yeni test: yön + kilit sıfırla
  if(!order.length){showResult('🎉','yeni kelime kalmadı','Tüm kelimeler çalışılıyor. Sınav sekmesinden tekrarlara devam et.','',true);return;}
  cur=order[0];queue=order.slice(1);testTotal=order.length;
  OXLOG.add('test_bas',{n:order.length});
  busy=false;buildDeck();
}
function startTest(){startTestFrom(shuffle(SRS.newList(SRS.listSize()).map(k=>BYK[k]).filter(Boolean)));}
function gradeTest(know){
  if(busy)return;
  const leaving=cur;
  OXLOG.add('test',{k:leaving._k,ok:know?1:0});
  if(!know){leaving._lockDir=true;queue.push(leaving);}   // bilemedin → yön kilitli, desteye geri
  cur=queue.length?queue.shift():null;                     // yeni üst (zaten arkada görünüyordu)
  // Bildim → sağa/sola fırlat; Bilemedim → destenin altına in.
  advanceDeck(know?(Math.random()<.5?'left':'right'):'sink');
}
function testDone(){showResult(String(testTotal),'kelime çalışıldı','Listeyi baştan sona çalıştın. 👏','',true);}

/* ---- SINAV: önce vadesi gelen tekrarlar (yüksek kutu önce, aynı kutudakiler karışık), sonra
   turun yeni kelimeleri (karışık; tur = başladığı andaki ana sayfa listesi). Günlük sınır yok:
   "Bitir" ile bırakılır, yeniden açılınca kalan tur kelimeleriyle sürer; tekrarlar ve tur
   bitince sınav kendiliğinden biter, sonraki sınav listenin yeni haliyle başlar.
   Her cevap anında kaydedilir; yanlış bilinen aynı sınavda tekrar gelmez. ---- */
function startExam(){mode='exam';showStage();document.getElementById('finish').classList.remove('hidden');
  document.getElementById('again').textContent='Bilemedim';document.getElementById('know').textContent='Bildim';
  GROUPS.forEach(g=>g.items.forEach(it=>{it._dir=null;}));
  const q=SRS.examQueue();
  examList=q.reviews.concat(q.news);revCount=q.reviews.length;examIdx=0;
  const nT=examList.length?Math.ceil(examList.length/10):0;            // %10 yazılı, en az 1
  typedSet=new Set(shuffle(examList.slice()).slice(0,nT));tyRes=null;
  sess={rev:0,revOk:0,nw:0,nwOk:0,ty:0,tyOk:0,wrong:[]};
  OXLOG.add('sinav_bas',{rev:revCount,nw:examList.length-revCount,yz:nT});
  cur=examList.length?BYK[examList[0]]:null;
  if(!cur){examDone();return;}
  if(!revCount)toast('Bugün vadesi gelen tekrar yok — yeni kelimelerle başlıyoruz.');
  busy=false;buildDeck();}
function gradeExam(correct){
  if(busy||!cur)return;
  const it=cur,ty=isTyped(it);
  const wasNew=SRS.isNew(it._k);
  const res=SRS.answer(it._k,correct,it._dir);            // kutu + vade + (yanlışta) yön kilidi
  if(wasNew){sess.nw++;if(correct)sess.nwOk++;}else{sess.rev++;if(correct)sess.revOk++;}
  if(ty){sess.ty++;if(correct)sess.tyOk++;document.getElementById('kpanel').classList.add('hidden');}
  OXLOG.add('cevap',{k:it._k,y:it._dir==='tr2en'?'te':'et',ok:correct?1:0,b:[res.from,res.to],
    ms:Math.round(performance.now()-tPrompt),yz:ty?1:0,g:(ty&&tyRes)?tyRes.vals:undefined});
  tyRes=null;
  OXACC.syncSoon(false);   // arkadaşların görsün (dakikada en çok bir)
  if(!correct)sess.wrong.push(it);
  examIdx++;cur=examList[examIdx]?BYK[examList[examIdx]]:null;
  setSecLabel();
  if(examIdx===revCount&&revCount>0&&cur)toast('Tekrarlar bitti — yeni kelimelere geçiliyor.');
  // Bildim → sağa, Bilemedim → sola.
  advanceDeck(correct?'right':'left');
}

// Kaldırılan hile tespitinin (adım 16) telefonda kalan kayıtları.
try{localStorage.removeItem('ox3000_cheat_v1');localStorage.removeItem('ox3000_cheat_migr_v4');}catch(e){}
function examDone(){
  const n=sess.rev+sess.nw,ok=sess.revOk+sess.nwOk,all=examList.length>0&&examIdx>=examList.length;
  if(n){try{const L=JSON.parse(localStorage.getItem(SKEY)||'[]');
    L.push({t:SRS.now(),n:n,ok:ok,rev:sess.rev,revOk:sess.revOk,nw:sess.nw,nwOk:sess.nwOk,ty:sess.ty,tyOk:sess.tyOk});
    localStorage.setItem(SKEY,JSON.stringify(L.slice(-300)));}catch(e){}}
  OXLOG.add('sinav_bit',{n:n,ok:ok,tum:all?1:0,yz:sess.ty,yzOk:sess.tyOk});
  if(n)OXACC.syncSoon(true,true);   // sınav bitince özet hemen, yedek (5 dk'da bir)
  const left=SRS.dueList().length,nd=SRS.nextDue();
  const nxt=left?'Bugün daha '+left+' tekrar var.':(nd==null?'':'Sonraki tekrar '+(nd===1?'yarın':nd+' gün sonra')+'.');
  let msg;
  if(all){const nl=SRS.newList(1).length;
    msg='Bu listenin bütün kelimeleri bitti. '+(nl?'Ana sayfada yeni kelimeler seni bekliyor; çalışınca sınava dönebilirsin. ':'')+(nxt?nxt:'');
    if(n)msg=[sess.rev?'Tekrar: '+sess.revOk+'/'+sess.rev:'',sess.nw?'Yeni: '+sess.nwOk+'/'+sess.nw:'',sess.ty?'Yazılı: '+sess.tyOk+'/'+sess.ty:''].filter(Boolean).join(' · ')+'. '+msg;}
  else if(!n)msg=((left||SRS.newList(1).length)?'Henüz cevap yok.':'Bugün sorulacak kelime yok. 🎉')+(nxt?' '+nxt:'');
  else msg=[sess.rev?'Tekrar: '+sess.revOk+'/'+sess.rev:'',sess.nw?'Yeni: '+sess.nwOk+'/'+sess.nw:'',sess.ty?'Yazılı: '+sess.tyOk+'/'+sess.ty:''].filter(Boolean).join(' · ')+'. '+(sess.nw?sess.nw+' kelime çalışılanlara eklendi. ':'')+nxt;
  const wl=sess.wrong.map(w=>`<div class="wr"><b>${w.w}</b> — <span>${w.tr||''}</span></div>`).join('');
  showResult(n?ok+'/'+n:'0',n?'doğru':'kelime cevaplandı',msg,wl,false);
  document.getElementById('r-again').textContent=all?'Yeni liste':'Sınava devam';
}

function showResult(big,small,msg,wlHtml,isTest){
  document.getElementById('stage').classList.add('hidden');document.getElementById('resultbox').classList.remove('hidden');
  document.getElementById('score').innerHTML=big+'<small>'+small+'</small>';
  document.getElementById('rmsg').textContent=msg;
  document.getElementById('wronglist').innerHTML=wlHtml||'';
  document.getElementById('r-again').textContent=isTest?'Tekrar çalış':'Sınava devam';
  document.getElementById('finish').classList.add('hidden');setSecLabel();drawBar();
  if(!isTest)document.getElementById('counter').textContent='';
}

function start(){(mode==='test'?startTest:startExam)();}
/* ---- Sınav sürerken her çıkışta onay: sağa/sola kaydırma, Test'e geçiş, Bitir, geri tuşu, bildirime dokunma.
   Cevaplar zaten anında kaydedildiği için çıkılırsa sınav sonra kaldığı yerden sürer. ---- */
function sinavda(){return mode==='exam'&&!!cur&&!document.getElementById('stage').classList.contains('hidden');}
let leaveBox=null;
function closeLeave(){if(leaveBox){leaveBox.remove();leaveBox=null;}}
function askLeave(what,act,go){
  if(leaveBox)return;
  leaveBox=document.createElement('div');leaveBox.className='leave';
  leaveBox.innerHTML='<div class="bx"><h3>Emin misin?</h3><p></p><div class="row"><button class="stay">Sınava devam et</button><button class="go"></button></div></div>';
  leaveBox.querySelector('p').textContent=what+' Cevapların kaydedildi; sonra kaldığın yerden devam edersin.';
  leaveBox.querySelector('.go').textContent=act;
  leaveBox.querySelector('.stay').onclick=closeLeave;
  leaveBox.querySelector('.go').onclick=()=>{closeLeave();OXLOG.add('sinav_cik',{n:examIdx});go();};
  leaveBox.addEventListener('click',e=>{if(e.target===leaveBox)closeLeave();});
  document.body.appendChild(leaveBox);
}
window.oxCikisSor=function(go,u){
  if(sinavda()&&u&&/^kartlar\.html\?exam=1/.test(u))return;   // hedef zaten bu sınav (ör. hatırlatmaya dokunuldu)
  if(sinavda())askLeave('Sınavdan çıkıyorsun.','Çık',go);else go();};
// Telefonun geri tuşu (MainActivity sorar): açık onayı kapatır; sınavdaysa sorar; değilse eski davranış (uygulamadan çık).
window.oxGeriYakala=function(){
  if(leaveBox){closeLeave();return true;}
  if(!sinavda())return false;
  askLeave('Sınavdan çıkıyorsun.','Çık',()=>{try{Capacitor.Plugins.Uygulama.geri();}catch(e){}});
  return true;
};
document.getElementById('moderow').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  const row=e.currentTarget,m=b.dataset.m;if(m==='exam'&&mode==='exam'&&sinavda())return;   // zaten sınavda: baştan başlatma
  const sw=()=>{[...row.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=m;start();};
  if(m==='test'&&sinavda())askLeave('Teste geçiyorsun.','Teste geç',sw);else sw();});
document.getElementById('deck').addEventListener('click',e=>{if(busy||!cur)return;if(slots[0]&&slots[0].contains(e.target)){
  if(side===0&&isTyped(cur)){   // yazılı kart dokunuşla açılmaz (cevap klavyeyle yazılır)
    if(cur._dir!=='tr2en')sayWord(cur.w);
    return;}
  if(side===0){var r=topFlip.getBoundingClientRect();reveal((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);}
  sayWord(cur.w);
}});
document.getElementById('open').addEventListener('click',()=>{if(busy||!cur||side===1)return;reveal(0.5,0.12);sayWord(cur.w);});
document.getElementById('again').addEventListener('click',()=>{mode==='test'?gradeTest(false):gradeExam(false);});
document.getElementById('know').addEventListener('click',()=>{mode==='test'?gradeTest(true):gradeExam(true);});
document.getElementById('check').addEventListener('click',()=>{if(busy||!cur)return;
  if(!tyRes)submitTyped();else if(side===1)gradeExam(tyRes.ok);});
document.getElementById('r-again').addEventListener('click',start);
document.getElementById('finish').addEventListener('click',()=>{if(busy||mode!=='exam')return;askLeave('Sınavı bitiriyorsun.','Bitir',()=>{if(mode==='exam')examDone();});});
document.getElementById('r-next').addEventListener('click',()=>{location.href='index.html';});
document.body.addEventListener('touchstart',()=>{if(synth&&!voices.length)loadV();},{once:true});
// Tekrar butonundan gelindiyse (?exam=1) doğrudan sınav modunda başla
try{if(new URLSearchParams(location.search).get('exam')==='1'){mode='exam';document.querySelectorAll('#moderow button').forEach(x=>x.classList.toggle('on',x.dataset.m==='exam'));}}catch(e){}
setSecLabel();start();
window.addEventListener('pageshow',e=>{if(e.persisted)setSecLabel();});
