<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oxford 3000 · 30 Grup — Sesli + Cambridge</title>
<style>
:root{--bg:#F5F6F8;--card:#fff;--ink:#1B2430;--muted:#7A8699;--line:#E7EAF0;--speak:#E5892B;--speak-d:#C9741A;
--isim:#1E88E5;--fiil:#2E9E5B;--sifat:#8E44AD;--zarf:#E67E22;--diger:#5D6D7E;--tr:#B03A2E;--ok:#0E8074;
--A1:#2E7D32;--A2:#C79100;--B1:#C2185B;--B2:#1565C0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 60px}
header{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;margin:0 -14px 12px}
.title{font-size:17px;font-weight:800;letter-spacing:-.02em}
.title small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px}
.grouprow{display:flex;gap:8px;align-items:center;margin-top:9px}
.nav{border:0;background:var(--ink);color:#fff;font-size:16px;font-weight:800;width:38px;height:38px;border-radius:10px;cursor:pointer;flex:0 0 auto}
.nav:disabled{opacity:.35}
select{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;font-size:14px;font-weight:600;color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:9px}
.seg{display:inline-flex;background:#EAEDF2;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.speed{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.speed input{width:84px}
.playall{margin-left:auto;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:8px 13px;border-radius:10px;cursor:pointer}
.playall.stop{background:var(--speak-d)}
.search{width:100%;margin-top:9px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:14px}
.hint{font-size:12px;color:var(--muted);background:#EEF2F7;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;line-height:1.5}
.warn{display:none;background:#FDECEA;border-color:#F5C4BD;color:#8A2A1E}
.lvlbadge{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:2px 7px;vertical-align:middle}
.secbar{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-weight:800;font-size:15px}
.dot{width:12px;height:12px;border-radius:4px}
.count{color:var(--muted);font-weight:600;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--diger);border-radius:14px;padding:11px 13px;margin:9px 0}
.card.playing{box-shadow:0 0 0 2px var(--speak),0 6px 18px rgba(229,137,43,.18)}
.row1{display:flex;align-items:center;gap:11px}
.word{font-size:19px;font-weight:800;letter-spacing:-.01em;cursor:pointer}
.tag{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.spk{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;background:var(--speak);color:#fff;font-size:18px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(229,137,43,.35)}
.spk:active{transform:scale(.92)}
.ok{color:var(--ok);font-weight:700;font-size:13.5px;margin-top:6px}
.tr{color:var(--tr);font-size:14px;margin-top:3px}
.en{color:#33414F;font-size:13px;margin-top:3px}
.ex{color:#5B6B7B;font-size:13px;font-style:italic;margin-top:5px;border-top:1px dashed var(--line);padding-top:5px;cursor:pointer}
.ex .mini{font-style:normal;color:var(--speak-d);font-weight:700;margin-right:5px}
.cam{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;color:#0B5FA5;text-decoration:none;background:#E8F1FB;border:1px solid #C4DBF3;border-radius:7px;padding:3px 8px}
.cam:active{background:#D8E8F8}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:24px;line-height:1.6}
.seclabel{font-size:16px;font-weight:800;color:var(--ink);padding:6px 2px 4px}
</style><script src="progress.js"></script></head><body><div class="wrap">
<header>
  <div class="seclabel" id="seclabel"></div>
  <div class="controls">
    <label class="speed">Hız <input id="rate" type="range" min="0.5" max="1" step="0.05" value="0.8"></label>
    <button class="playall" id="playall">▶ Grubu oku</button>
  </div>
  <input class="search" id="search" placeholder="Bu grupta ara… (İngilizce/Türkçe)">
</header>
<div class="hint warn" id="warn">Bu tarayıcı sesli okumayı desteklemiyor gibi. Her karttaki <b>Cambridge</b> bağlantısını kullan.</div>
<div id="list"></div>
</div>
<script>
const GROUPS=[{"no":1,"level":"A1","lo":1,"hi":100,"items":[{"w":"boring","pos":"sıfat","sec":"Sıfatlar","tr":"sıkıcı","ok":"BO-ring","en":"not interesting; making you feel tired","ex":"The film was so <b>boring</b> that I fell asleep.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/boring"},{"w":"winter","pos":"isim","sec":"İsimler","tr":"kış","ok":"UİN-tır","en":"the coldest season of the year","ex":"It often snows here in <b>winter</b>.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/winter"},{"w":"live","pos":"fiil","sec":"Fiiller","tr":"yaşamak; canlı","ok":"LİV","en":"to have your home somewhere; to be alive","ex":"They <b>live</b> in a small village.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/live"},{"w":"metre","pos":"isim","sec":"İsimler","tr":"metre","ok":"Mİİ-tır","en":"a unit of length (100 cm)","ex":"The room is five <b>metres</b> long.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/metre"},{"w":"pig","pos":"isim","sec":"İsimler","tr":"domuz","ok":"PİG","en":"a farm animal kept for its meat","ex":"The <b>pig</b> was sleeping in the mud.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/pig"},{"w":"will","pos":"kip fiili","sec":"Diğer","tr":"irade; -ecek","ok":"UİL","en":"used to talk about the future","ex":"I <b>will</b> call you tomorrow.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/will"},{"w":"example","pos":"isim","sec":"İsimler","tr":"örnek","ok":"ig-ZEMP-ıl","en":"a thing that shows what others are like","ex":"Can you give me an <b>example</b>?","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/example"},{"w":"opposite","pos":"sıfat","sec":"Sıfatlar","tr":"karşı; zıt","ok":"O-pı-zit","en":"completely different; facing","ex":"'Hot' is the <b>opposite</b> of 'cold'.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/opposite"},{"w":"from","pos":"edat","sec":"Diğer","tr":"-den, -dan","ok":"FRAM","en":"showing where something starts","ex":"She comes <b>from</b> Italy.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/from"},{"w":"most","pos":"belirteç","sec":"Diğer","tr":"en çok, çoğu","ok":"MOUST","en":"the largest number or amount","ex":"<b>Most</b> people like music.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/most"},{"w":"course","pos":"isim","sec":"İsimler","tr":"kurs; rota; yemek servisi","ok":"KORS","en":"a set of lessons; a part of a meal","ex":"I'm taking an English <b>course</b>.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/course"},{"w":"football","pos":"isim","sec":"İsimler","tr":"futbol","ok":"FUT-bol","en":"a game played by two teams with a ball","ex":"They play <b>football</b> every weekend.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/football"},{"w":"another","pos":"belirteç","sec":"Diğer","tr":"başka bir","ok":"ı-NA-dır","en":"one more; a different one","ex":"Would you like <b>another</b> cup of tea?","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/another"},{"w":"hour","pos":"isim","sec":"İsimler","tr":"saat","ok":"A-uır","en":"a period of 60 minutes","ex":"The trip takes about an <b>hour</b>.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/hour"},{"w":"o'clock","pos":"zarf","sec":"Zarflar","tr":"saat (tam)","ok":"ı-KLOK","en":"used to say the exact hour","ex":"I get up at seven <b>o'clock</b>.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/o-clock"},{"w":"off","pos":"zarf","sec":"Zarflar","tr":"kapalı; uzakta","ok":"OF","en":"away from; not on","ex":"Please turn <b>off</b> the light.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/off"},{"w":"next","pos":"sıfat","sec":"Sıfatlar","tr":"sonraki, gelecek","ok":"NEKST","en":"coming immediately after","ex":"See you <b>next</b> week.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/next"},{"w":"shower","pos":"isim","sec":"İsimler","tr":"duş; sağanak","ok":"ŞA-uır","en":"a wash under falling water; light rain","ex":"I take a <b>shower</b> every morning.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/shower"},{"w":"he","pos":"zamir","sec":"Diğer","tr":"o (erkek)","ok":"Hİİ","en":"the male person already mentioned","ex":"<b>He</b> is my brother.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/he"},{"w":"dialogue","pos":"isim","sec":"İsimler","tr":"diyalog","ok":"DA-yı-log","en":"a conversation between people","ex":"Practise the <b>dialogue</b> with a partner.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/dialogue"},{"w":"wake","pos":"fiil","sec":"Fiiller","tr":"uyanmak","ok":"UEYK","en":"to stop sleeping","ex":"I <b>wake</b> up at six every day.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/wake"},{"w":"introduce","pos":"fiil","sec":"Fiiller","tr":"tanıtmak; takdim etmek","ok":"int-rı-DYUS","en":"to make people know each other; to present","ex":"Let me <b>introduce</b> my friend Ali.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/introduce"},{"w":"one","pos":"sayı","sec":"Diğer","tr":"bir","ok":"UAN","en":"the number 1","ex":"I only have <b>one</b> sister.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/one"},{"w":"page","pos":"isim","sec":"İsimler","tr":"sayfa","ok":"PEYC","en":"one side of a sheet in a book","ex":"Open your book to <b>page</b> ten.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/page"},{"w":"tree","pos":"isim","sec":"İsimler","tr":"ağaç","ok":"TRİİ","en":"a tall plant with a trunk and branches","ex":"There is a big <b>tree</b> in the garden.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/tree"},{"w":"sick","pos":"sıfat","sec":"Sıfatlar","tr":"hasta","ok":"SİK","en":"ill; not well","ex":"She stayed home because she felt <b>sick</b>.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/sick"},{"w":"into","pos":"edat","sec":"Diğer","tr":"içine","ok":"İN-tu","en":"to the inside of","ex":"He walked <b>into</b> the room.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/into"},{"w":"tomorrow","pos":"zarf","sec":"Zarflar","tr":"yarın","ok":"tı-MO-rou","en":"the day after today","ex":"We have an exam <b>tomorrow</b>.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/tomorrow"},{"w":"November","pos":"isim","sec":"İsimler","tr":"kasım","ok":"no-VEM-bır","en":"the eleventh month of the year","ex":"My birthday is in <b>November</b>.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/november"},{"w":"statement","pos":"isim","sec":"İsimler","tr":"ifade, açıklama","ok":"STEYT-mınt","en":"something you say or write clearly","ex":"The police took her <b>statement</b>.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/statement"},{"w":"Tuesday","pos":"isim","sec":"İsimler","tr":"salı","ok":"TYUZ-dey","en":"the day after Monday","ex":"The meeting is on <b>Tuesday</b>.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/tuesday"},{"w":"eighteen","pos":"sayı","sec":"Diğer","tr":"on sekiz","ok":"ey-TİİN","en":"the number 18","ex":"You must be <b>eighteen</b> to drive here.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/eighteen"},{"w":"area","pos":"isim","sec":"İsimler","tr":"alan, bölge","ok":"E-ri-ı","en":"a part of a place; a region","ex":"This <b>area</b> is very quiet.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/area"},{"w":"when","pos":"zarf","sec":"Zarflar","tr":"ne zaman; -dığında","ok":"UEN","en":"at what time","ex":"<b>When</b> does the film start?","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/when"},{"w":"open","pos":"sıfat","sec":"Sıfatlar","tr":"açık; açmak","ok":"OU-pın","en":"not closed; to make open","ex":"The shop is <b>open</b> until nine.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/open"},{"w":"cow","pos":"isim","sec":"İsimler","tr":"inek","ok":"KAU","en":"a large farm animal that gives milk","ex":"The <b>cow</b> is eating grass.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/cow"},{"w":"hope","pos":"fiil","sec":"Fiiller","tr":"umut, ümit etmek","ok":"HOUP","en":"to want something to happen","ex":"I <b>hope</b> you feel better soon.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/hope"},{"w":"information","pos":"isim","sec":"İsimler","tr":"bilgi","ok":"in-fır-MEY-şın","en":"facts about someone or something","ex":"I need more <b>information</b> about the course.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/information"},{"w":"match","pos":"isim","sec":"İsimler","tr":"maç; kibrit; eşleşmek","ok":"MEÇ","en":"a game; a small stick for fire","ex":"We watched the football <b>match</b>.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/match"},{"w":"sheep","pos":"isim","sec":"İsimler","tr":"koyun","ok":"ŞİİP","en":"a farm animal kept for wool and meat","ex":"The <b>sheep</b> are in the field.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/sheep"},{"w":"space","pos":"isim","sec":"İsimler","tr":"boşluk; uzay","ok":"SPEYS","en":"an empty area; outer space","ex":"There isn't much <b>space</b> in my room.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/space"},{"w":"husband","pos":"isim","sec":"İsimler","tr":"koca, eş","ok":"HAZ-bınd","en":"the man a woman is married to","ex":"Her <b>husband</b> is a teacher.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/husband"},{"w":"clock","pos":"isim","sec":"İsimler","tr":"saat","ok":"KLOK","en":"a device that shows the time","ex":"The <b>clock</b> on the wall is slow.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/clock"},{"w":"history","pos":"isim","sec":"İsimler","tr":"tarih","ok":"HİS-tri","en":"events of the past; the school subject","ex":"I love reading about ancient <b>history</b>.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/history"},{"w":"reason","pos":"isim","sec":"İsimler","tr":"neden, sebep","ok":"RİİZ-ın","en":"why something happens","ex":"What is the <b>reason</b> for the delay?","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/reason"},{"w":"away","pos":"zarf","sec":"Zarflar","tr":"uzağa, uzakta","ok":"ı-UEY","en":"to or at a distance","ex":"The station is two kilometres <b>away</b>.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/away"},{"w":"sister","pos":"isim","sec":"İsimler","tr":"kız kardeş","ok":"SİS-tır","en":"a female with the same parents as you","ex":"My <b>sister</b> is younger than me.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/sister"},{"w":"grey","pos":"sıfat","sec":"Sıfatlar","tr":"gri","ok":"GREY","en":"a colour between black and white","ex":"The sky is <b>grey</b> today.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/grey"},{"w":"price","pos":"isim","sec":"İsimler","tr":"fiyat","ok":"PRAYS","en":"the money you pay for something","ex":"The <b>price</b> of the ticket is ten euros.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/price"},{"w":"paint","pos":"fiil","sec":"Fiiller","tr":"boya; boyamak, resim yapmak","ok":"PEYNT","en":"coloured liquid; to make a picture","ex":"They will <b>paint</b> the wall blue.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/paint"},{"w":"funny","pos":"sıfat","sec":"Sıfatlar","tr":"komik","ok":"FA-ni","en":"making you laugh","ex":"He told a <b>funny</b> joke.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/funny"},{"w":"museum","pos":"isim","sec":"İsimler","tr":"müze","ok":"myu-Zİİ-ım","en":"a place that shows old or important things","ex":"We visited the science <b>museum</b>.","cam":"https://dictionary.cambridge.org/dictionary/english-turkish/museum"},{"w":"see","pos" const SECS=["İsimler","Fiiller","Sıfatlar","Zarflar","Diğer"];
const SColor={"İsimler":"var(--isim)","Fiiller":"var(--fiil)","Sıfatlar":"var(--sifat)","Zarflar":"var(--zarf)","Diğer":"var(--diger)"};
const posTag={"isim":"isim","fiil":"fiil","sıfat":"sıfat","zarf":"zarf","edat":"edat","bağlaç":"bağlaç","zamir":"zamir","belirteç":"belirteç","ünlem":"ünlem","sayı":"sayı","kip fiili":"kip fiili","yardımcı fiil":"yard. fiil","artikel":"artikel","mastar":"mastar"};
let LANG="en-US",RATE=0.8,voices=[],gi=(window.OX?Math.max(0,Math.min(OX.current(),GROUPS.length-1)):0);const synth=window.speechSynthesis;
function loadV(){voices=synth?synth.getVoices():[];}
if(synth){loadV();synth.onvoiceschanged=loadV;}else{document.getElementById('warn').style.display='block';}
function pick(l){if(!voices.length)loadV();return voices.find(v=>v.lang===l)||voices.find(v=>v.lang&&v.lang.slice(0,2)===l.slice(0,2))||null;}
let playing=false,queue=[],cur=null;
function clr(){if(cur){cur.classList.remove('playing');cur=null;}}
function speak(t,card,after){if(!synth)return;const u=new SpeechSynthesisUtterance(t);const v=pick(LANG);if(v)u.voice=v;u.lang=LANG;u.rate=RATE;if(card){clr();cur=card;card.classList.add('playing');}u.onend=()=>{if(card)card.classList.remove('playing');if(after)after();};u.onerror=u.onend;synth.speak(u);}
function one(t,card){if(synth)synth.cancel();stop();speak(t,card);}
function stop(){playing=false;queue=[];if(synth)synth.cancel();clr();const b=document.getElementById('playall');b.textContent="▶ Grubu oku";b.classList.remove('stop');}
function all(){const cs=[...document.querySelectorAll('.card')].filter(c=>c.style.display!=='none');if(!cs.length)return;
  const b=document.getElementById('playall');b.textContent="■ Durdur";b.classList.add('stop');playing=true;
  const native=window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform();
  if(native&&synth){
    // Ekran kapalıyken de sürsün diye tek bir seslendirme olarak oku (cihaz TTS'i arka planda çalar).
    synth.cancel();const text=cs.map(c=>c.dataset.w).join('. ')+'.';
    const u=new SpeechSynthesisUtterance(text);u.lang=LANG;u.rate=RATE;u.onend=()=>stop();u.onerror=()=>stop();synth.speak(u);return;
  }
  queue=cs.slice();const step=()=>{if(!playing||!queue.length){stop();return;}const c=queue.shift();c.scrollIntoView({behavior:'smooth',block:'center'});speak(c.dataset.w,c,()=>setTimeout(step,250));};step();}

function setSecLabel(){const g=GROUPS[gi];document.getElementById('seclabel').textContent='Bölüm '+String(g.no).padStart(2,'0')+' · '+g.level;}
function renderGroup(){stop();const g=GROUPS[gi];const list=document.getElementById('list');list.innerHTML='';
const bs={};SECS.forEach(s=>bs[s]=[]);g.items.forEach(d=>bs[d.sec].push(d));
SECS.forEach(s=>{const arr=bs[s].slice().sort((a,b)=>a.w.localeCompare(b.w));if(!arr.length)return;
const bar=document.createElement('div');bar.className='secbar';bar.innerHTML=`<span class="dot" style="background:${SColor[s]}"></span>${s} <span class="count">${arr.length}</span>`;list.appendChild(bar);
arr.forEach(d=>{const c=document.createElement('div');c.className='card';c.style.borderLeftColor=SColor[s];c.dataset.w=d.w;c.dataset.s=(d.w+' '+(d.tr||'')).toLowerCase();
c.innerHTML=`<div class="row1"><span class="word">${d.w}</span><span class="tag">${posTag[d.pos]||''} · ${g.level}</span><button class="spk" aria-label="Dinle">🔊</button></div>
${d.ok?`<div class="ok">Okunuş: ${d.ok}</div>`:''}
<div class="tr">${d.tr||''}</div>
${d.en?`<div class="en">${d.en}</div>`:''}
${d.ex?`<div class="ex">${d.ex}</div>`:''}
<a class="cam" href="${d.cam}" target="_blank" rel="noopener">🔊 Cambridge →</a>`;
c.querySelector('.word').onclick=()=>one(d.w,c);
c.querySelector('.spk').onclick=e=>{e.stopPropagation();one(d.w,c);};
const ex=c.querySelector('.ex');if(ex)ex.onclick=()=>one(d.ex,c);
list.appendChild(c);});});
document.getElementById('search').value='';window.scrollTo({top:0});}

document.getElementById('rate').addEventListener('input',e=>RATE=parseFloat(e.target.value));
document.getElementById('playall').addEventListener('click',()=>{playing?stop():all();});
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.card').forEach(c=>{c.style.display=c.dataset.s.includes(q)?'':'none';});});
document.body.addEventListener('touchstart',()=>{if(synth&&!voices.length)loadV();},{once:true});
setSecLabel();renderGroup();
</script></body></html>
