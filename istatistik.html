<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oxford 3000 · İlerleme</title>
<script src="log.js"></script><script src="srs.js"></script>
<style>
:root{--bg:#F4F6F9;--card:#fff;--ink:#1B2430;--muted:#7A8699;--line:#E6EAF1;--accent:#3B6EA5;--green:#2E9E5B;--amber:#E5892B;--neu:#C7D0DB;--green-bg:#E7F5EC;--amber-bg:#FCF0E1;--secgray:#EDF0F4;--secgray-ink:#9AA6B4;--gold:#C9A227;--gold-bg:#FBF3D6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:600px;margin:0 auto;padding:8px 14px calc(24px + env(safe-area-inset-bottom))}
.bar-top{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
.back{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--ink);font-weight:800;font-size:14px;padding:6px 12px 6px 4px}
.back span{font-size:20px;line-height:1}
h1{font-size:20px;font-weight:800;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 20px rgba(20,30,50,.06);padding:16px;margin-bottom:14px}
.card h2{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin:0 0 12px}
.big{display:flex;gap:10px;text-align:center;margin-bottom:14px}
.big .cell{flex:1;background:var(--bg);border-radius:12px;padding:12px 6px}
.big .n{font-size:26px;font-weight:800;line-height:1}
.big .l{font-size:11px;color:var(--muted);font-weight:700;margin-top:4px}
.big .n.k{color:var(--green)} .big .n.a{color:var(--amber)} .big .n.d{color:var(--accent)}
.pbar{height:12px;border-radius:8px;background:var(--neu);overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
.pbar .k{background:var(--green)} .pbar .a{background:var(--amber)}
.lvl-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.lvl-row .tag{flex:0 0 34px;font-weight:800;font-size:13px;color:#fff;background:var(--accent);border-radius:6px;text-align:center;padding:3px 0}
.lvl-row .track{flex:1;height:9px;border-radius:6px;background:var(--neu);overflow:hidden}
.lvl-row .track i{display:block;height:100%;background:var(--green)}
.lvl-row .num{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--muted);min-width:62px;text-align:right}
.ex-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ex-row:first-of-type{border-top:0}
.ex-row .g{flex:0 0 auto;font-weight:800;font-size:13px}
.ex-row .d{flex:1;font-size:11.5px;color:var(--muted)}
.ex-row .p{flex:0 0 auto;font-weight:800;font-size:15px}
.ex-row .p.hi{color:var(--green)} .ex-row .p.mid{color:var(--amber)} .ex-row .p.lo{color:#D9544D}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 0}
.sub{font-size:14px;font-weight:800;color:var(--muted);margin:2px 0 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sec{border-radius:14px;padding:9px 8px 8px;border:1.5px solid var(--line);background:var(--secgray)}
.sec.on{background:#fff}
.sec.done{background:var(--green-bg);border-color:var(--green)}
.sec .top{display:flex;align-items:center;justify-content:space-between}
.sec .snum{font-size:12px;font-weight:800;color:var(--ink)}
.sec .slvl{font-size:10px;font-weight:800;color:#fff;background:var(--accent);border-radius:5px;padding:1px 6px}
.sec .cnt{display:flex;justify-content:space-between;margin:7px 0 6px;font-size:15px;font-weight:800}
.sec .cnt .k{color:var(--green)} .sec .cnt .a{color:var(--amber)} .sec .cnt .z{color:var(--secgray-ink)}
.sec .mini{height:5px;border-radius:3px;background:var(--neu);overflow:hidden;display:flex}
.sec .mini i{display:block;height:100%} .sec .mini .k{background:var(--green)} .sec .mini .a{background:var(--amber)}
.legend{display:flex;gap:12px;font-size:11px;font-weight:700;color:var(--muted);margin:-4px 0 10px}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar-top">
    <div><h1>İlerleme</h1><div class="sub" id="seclabel"></div></div>
  </div>

  <div class="card">
    <h2>Genel</h2>
    <div class="big">
      <div class="cell"><div class="n k" id="n-known">0</div><div class="l">Olgun</div></div>
      <div class="cell"><div class="n a" id="n-learn">0</div><div class="l">Öğreniliyor</div></div>
      <div class="cell"><div class="n" id="n-neu">0</div><div class="l">Yeni</div></div>
    </div>
    <div class="pbar"><i class="k" id="pb-k"></i><i class="a" id="pb-a"></i></div>
  </div>

  <div class="card">
    <h2>Seviyeye göre</h2>
    <div id="levels"></div>
  </div>

  <div class="card">
    <h2>Kısımlar</h2>
    <div class="legend"><span><b style="background:var(--green)"></b>olgun</span><span><b style="background:var(--amber)"></b>öğreniliyor</span><span><b style="background:var(--neu)"></b>yeni</span></div>
    <div class="grid" id="secgrid"></div>
  </div>

  <div class="card">
    <h2>Son sınavlar</h2>
    <div id="exams"></div>
  </div>
</div>

SRS.setCatalog(SRS.catalogFromGroups(SG));
const pc=(x,t)=>t?(x/t*100)+'%':'0%';

function render(){
  const lv=SRS.topLevel();
  document.getElementById('seclabel').textContent=SRS.inCycle()+(lv?' · '+lv:'');

  /* Genel */
  const T=SRS.totals();
  document.getElementById('n-known').textContent=T.mature;
  document.getElementById('n-learn').textContent=T.learning;
  document.getElementById('n-neu').textContent=T.fresh;
  document.getElementById('pb-k').style.width=pc(T.mature,T.total);
  document.getElementById('pb-a').style.width=pc(T.learning,T.total);

  /* Kısımlar + seviyeler */
  const byLvl={};
  document.getElementById('secgrid').innerHTML=SG.map((g,i)=>{
    const c=SRS.groupCounts(i);
    const L=byLvl[g.level]||(byLvl[g.level]={total:0,mature:0});L.total+=c.total;L.mature+=c.mature;
    const cls=c.mature===c.total?' done':(c.fresh<c.total?' on':'');
    return '<div class="sec'+cls+'"><div class="top"><span class="snum">Kısım '+g.no+'</span><span class="slvl">'+g.level+'</span></div>'
      +'<div class="cnt"><span class="k">'+c.mature+'</span><span class="a">'+c.learning+'</span><span class="z">'+c.fresh+'</span></div>'
      +'<div class="mini"><i class="k" style="width:'+pc(c.mature,c.total)+'"></i><i class="a" style="width:'+pc(c.learning,c.total)+'"></i></div></div>';
  }).join('');
  document.getElementById('levels').innerHTML=['A1','A2','B1','B2'].filter(l=>byLvl[l]).map(l=>{
    const d=byLvl[l];
    return '<div class="lvl-row"><span class="tag">'+l+'</span>'
      +'<span class="track"><i style="width:'+pc(d.mature,d.total)+'"></i></span>'
      +'<span class="num">'+d.mature+'/'+d.total+'</span></div>';
  }).join('');

  /* Son sınavlar */
  let ss=[];try{ss=JSON.parse(localStorage.getItem('ox3000_sessions_v1')||'[]');}catch(e){}
  ss=ss.slice(-30).reverse();
  document.getElementById('exams').innerHTML=ss.length
    ? ss.map(e=>{const p=e.n?Math.round(e.ok/e.n*100):0,c=p>=90?'hi':p>=70?'mid':'lo';
        const parts=[e.rev?'Tekrar '+e.revOk+'/'+e.rev:'',e.nw?'Yeni '+e.nwOk+'/'+e.nw:''].filter(Boolean).join(' · ');
        return '<div class="ex-row"><span class="g">'+e.ok+'/'+e.n+'</span>'
          +'<span class="d">'+fmtDate(e.t)+' · '+parts+'</span>'
          +'<span class="p '+c+'">%'+p+'</span></div>';}).join('')
    : '<div class="empty">Henüz sınav yapmadın. Çalışma sayfasında “Sınav”ı dene.</div>';
}
function fmtDate(t){const d=new Date(t);const p=n=>('0'+n).slice(-2);
  return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());}
render();
window.addEventListener('pageshow',e=>{if(e.persisted)render();});
</script>
