<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oxford 3000 · İlerleme</title>
<style>
:root{--bg:#F4F6F9;--card:#fff;--ink:#1B2430;--muted:#7A8699;--line:#E6EAF1;--accent:#3B6EA5;--green:#2E9E5B;--amber:#E5892B;--neu:#C7D0DB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:600px;margin:0 auto;padding:8px 14px calc(24px + env(safe-area-inset-bottom))}
.bar-top{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
.back{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--ink);font-weight:800;font-size:14px;padding:6px 12px 6px 4px}
.back span{font-size:20px;line-height:1}
h1{font-size:20px;font-weight:800;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 20px rgba(20,30,50,.06);padding:16px;margin-bottom:14px}
.card h2{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;margin:0 0 12px}
.big{display:flex;gap:10px;text-align:center;margin-bottom:14px}
.big .cell{flex:1;background:var(--bg);border-radius:12px;padding:12px 6px}
.big .n{font-size:26px;font-weight:800;line-height:1}
.big .l{font-size:11px;color:var(--muted);font-weight:700;margin-top:4px}
.big .n.k{color:var(--green)} .big .n.a{color:var(--amber)} .big .n.d{color:var(--accent)}
.pbar{height:12px;border-radius:8px;background:var(--neu);overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
.pbar .k{background:var(--green)} .pbar .a{background:var(--amber)}
.legend{display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.legend b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle}
.lvl-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.lvl-row .tag{flex:0 0 34px;font-weight:800;font-size:13px;color:#fff;background:var(--accent);border-radius:6px;text-align:center;padding:3px 0}
.lvl-row .track{flex:1;height:9px;border-radius:6px;background:var(--neu);overflow:hidden}
.lvl-row .track i{display:block;height:100%;background:var(--green)}
.lvl-row .num{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--muted);min-width:62px;text-align:right}
.ex-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ex-row:first-of-type{border-top:0}
.ex-row .g{flex:0 0 auto;font-weight:800;font-size:13px}
.ex-row .d{flex:1;font-size:11.5px;color:var(--muted)}
.ex-row .p{flex:0 0 auto;font-weight:800;font-size:15px}
.ex-row .p.hi{color:var(--green)} .ex-row .p.mid{color:var(--amber)} .ex-row .p.lo{color:#D9544D}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 0}
@media (prefers-color-scheme:dark){
  :root{--bg:#12161C;--card:#1B2129;--ink:#EAF0F7;--muted:#8A96A6;--line:#2A323C;--neu:#2A323C}
  .big .cell{background:#12161C}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar-top">
    <a class="back" href="__BACK__"><span>‹</span> Kartlar</a>
    <h1>İlerleme</h1>
  </div>

  <div class="card">
    <h2>Genel</h2>
    <div class="big">
      <div class="cell"><div class="n k" id="n-known">0</div><div class="l">Öğrenildi</div></div>
      <div class="cell"><div class="n a" id="n-learn">0</div><div class="l">Öğreniliyor</div></div>
      <div class="cell"><div class="n" id="n-neu">0</div><div class="l">Başlanmadı</div></div>
    </div>
    <div class="pbar"><i class="k" id="pb-k"></i><i class="a" id="pb-a"></i></div>
    <div class="legend">
      <span><b style="background:var(--green)"></b>Öğrenildi (kutu 4–5)</span>
      <span><b style="background:var(--amber)"></b>Öğreniliyor</span>
      <span><b style="background:var(--neu)"></b>Başlanmadı</span>
    </div>
    <div class="legend" id="due-line" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h2>Seviyeye göre</h2>
    <div id="levels"></div>
  </div>

  <div class="card">
    <h2>Son sınavlar</h2>
    <div id="exams"></div>
  </div>
</div>

<script>
const SG=__GROUPS_JSON__;
const store=JSON.parse(localStorage.getItem('ox3000_srs_v1')||'{}');
const exams=JSON.parse(localStorage.getItem('ox3000_exams_v1')||'[]');
const now=Date.now();
function cls(w){const r=store[w];if(!r||!r.box)return 'neu';if(r.box>=4)return 'known';return 'learn';}

let total=0,known=0,learn=0,neu=0,due=0;
const byLvl={};
SG.forEach(g=>{
  const L=byLvl[g.level]||(byLvl[g.level]={total:0,known:0});
  g.ws.forEach(w=>{
    total++;L.total++;
    const c=cls(w);
    if(c==='known'){known++;L.known++;}
    else if(c==='learn')learn++;
    else neu++;
    const r=store[w];if(r&&r.due<=now)due++;
  });
});

document.getElementById('n-known').textContent=known;
document.getElementById('n-learn').textContent=learn;
document.getElementById('n-neu').textContent=neu;
document.getElementById('pb-k').style.width=(known/total*100)+'%';
document.getElementById('pb-a').style.width=(learn/total*100)+'%';
document.getElementById('due-line').innerHTML=
  '<span>Bugün tekrar bekleyen: <b style="background:none;width:auto;color:var(--accent);font-weight:800">'+due+' kelime</b></span>';

const order=['A1','A2','B1','B2'];
document.getElementById('levels').innerHTML=order.filter(l=>byLvl[l]).map(l=>{
  const d=byLvl[l];const pct=d.total?Math.round(d.known/d.total*100):0;
  return '<div class="lvl-row"><span class="tag">'+l+'</span>'
    +'<span class="track"><i style="width:'+pct+'%"></i></span>'
    +'<span class="num">'+d.known+'/'+d.total+'</span></div>';
}).join('');

function fmtDate(t){const d=new Date(t);const p=n=>('0'+n).slice(-2);
  return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());}
const ex=exams.slice().sort((a,b)=>b.t-a.t);
document.getElementById('exams').innerHTML = ex.length
  ? ex.map(e=>{
      const pc=e.pct>=90?'hi':e.pct>=70?'mid':'lo';
      const gno=('0'+(e.no||(e.g+1))).slice(-2);
      return '<div class="ex-row"><span class="g">Grup '+gno+' · '+(e.level||'')+'</span>'
        +'<span class="d">'+fmtDate(e.t)+' · '+e.score+'/'+e.total+'</span>'
        +'<span class="p '+pc+'">%'+e.pct+'</span></div>';
    }).join('')
  : '<div class="empty">Henüz sınav yapmadın. Kartlar ekranında “Gün sonu sınavı”nı dene.</div>';
</script>
</body></html>
