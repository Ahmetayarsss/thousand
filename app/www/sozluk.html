<!DOCTYPE html><html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thousand · Sözlük</title>
<style>
:root{--bg:#F5F6F8;--card:#fff;--ink:#1B2430;--muted:#7A8699;--line:#E7EAF0;--speak:#E5892B;--speak-d:#C9741A;
--isim:#1E88E5;--fiil:#2E9E5B;--sifat:#8E44AD;--zarf:#E67E22;--diger:#5D6D7E;--tr:#B03A2E;--ok:#0E8074}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 60px}
header{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;margin:0 -14px 12px}
.toprow{display:flex;align-items:center;gap:10px}
.back{flex:0 0 auto;border:0;background:var(--solid);color:var(--on-solid);font-size:15px;font-weight:800;width:38px;height:38px;border-radius:10px;cursor:pointer;text-decoration:none;display:grid;place-items:center}
.title{font-size:17px;font-weight:800;letter-spacing:-.02em}
.title small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:1px}
.search{width:100%;margin-top:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px}
.hint{color:var(--muted);text-align:center;font-size:13.5px;margin-top:40px;line-height:1.6}
.hint .big{font-size:34px;display:block;margin-bottom:8px}
.count{color:var(--muted);font-size:12px;margin:2px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--diger);border-radius:14px;padding:12px 14px;margin:9px 0;cursor:pointer}
.card.playing{box-shadow:0 0 0 2px var(--speak),0 6px 18px rgba(229,137,43,.18)}
.card:active{transform:scale(.997)}
.row1{display:flex;align-items:center;gap:11px}
.word{font-size:21px;font-weight:800;letter-spacing:-.01em}
.tag{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.spk{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;background:var(--speak);color:#fff;font-size:19px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(229,137,43,.35)}
.spk:active{transform:scale(.92)}
.spk.playing{box-shadow:0 0 0 3px rgba(229,137,43,.35)}
.ok{color:var(--ok);font-weight:700;font-size:14px;margin-top:7px}
.tr{color:var(--tr);font-size:15px;margin-top:4px}
.en{color:var(--en);font-size:13.5px;margin-top:4px}
.ex{color:var(--ex);font-size:13.5px;font-style:italic;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
</style><script src="kelimeler.js"></script><script src="log.js"></script><script src="gecis.js"></script><script src="hesap.js"></script><script>(function(){var m=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)');function s(){document.documentElement.setAttribute('data-theme',m&&m.matches?'dark':'light');}s();if(m&&m.addEventListener)m.addEventListener('change',s);})();</script><style>:root{--solid:#1B2430;--on-solid:#fff;--field:#fff;--soft:#E9EDF3;--soft2:#EEF2F7;--en:#33414F;--ex:#5B6B7B;--sep:#D5DCE7;--face-line:#c7d2e3;--hdr:rgba(245,246,248,.95);--bad-bg:#FDECEA;--bad-line:#F5C4BD;--bad-ink:#8A2A1E;--good-bg:#E9F7EF;--warn-bg:#FCF3E3;--warn-line:#F2E0BE;--warn-ink:#8A6D3B;--kb:#D9E0EA;--key:#fff;--key2:#B9C4D4;--key3:#AEB9C9;--key4:#8E9BB0;--shade:rgba(20,30,50,.06);--scrim:rgba(20,27,38,.5);--bar:#fff}:root[data-theme=dark]{color-scheme:dark;--bg:#0F141B;--card:#19202A;--ink:#E4E9F0;--ink2:#C5CDD8;--muted:#8D99AA;--line:#2B3542;--accent:#5B8FD0;--green:#35A867;--green-d:#2E9A5E;--red:#DE5F57;--red-d:#E87A72;--tr:#EE8579;--ok:#3CC2B0;--amber:#E5892B;--neu:#3A4554;--green-bg:#17352A;--amber-bg:#3A2C1A;--secgray:#222B36;--secgray-ink:#7C8899;--gold:#D4AE3A;--gold-bg:#3A3218;--dev:#B27AD0;--solid:#2F3B4C;--on-solid:#F2F5F9;--field:#222B36;--soft:#222B36;--soft2:#1E2631;--en:#C5CDD8;--ex:#9AA6B6;--sep:#3A4554;--face-line:#2B3542;--hdr:rgba(15,20,27,.95);--bad-bg:#3A1E1C;--bad-line:#5A2C28;--bad-ink:#F2A59D;--good-bg:#17352A;--warn-bg:#3A2C1A;--warn-line:#5A4428;--warn-ink:#E8C48A;--kb:#151B23;--key:#2A3442;--key2:#3A4656;--key3:#3A4656;--key4:#4A5768;--shade:rgba(0,0,0,.35);--scrim:rgba(0,0,0,.6);--bar:#151B23}</style><script src="updater.js"></script><script src="tts-bridge.js"></script><script>(function(){var N='index.html',P='',U='ayarlar.html',D='arkadaslar.html';var x0=0,y0=0,t0=0,ok=false,top=false,bot=false;function go(u){if(window.oxCikisSor)window.oxCikisSor(function(){location.href=u;},u);else location.href=u;}addEventListener('touchstart',function(e){if(e.touches.length!==1){ok=false;return;}var el=e.target;if(el.closest&&el.closest('input,select,button,a,textarea')){ok=false;return;}var t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();ok=true;var se=document.scrollingElement||document.documentElement;top=se.scrollTop<=0;bot=se.scrollTop+innerHeight>=se.scrollHeight-2;},{passive:true});addEventListener('touchend',function(e){if(!ok)return;ok=false;var t=e.changedTouches[0];var dx=t.clientX-x0,dy=t.clientY-y0;if(Date.now()-t0>800)return;if(Math.abs(dy)>=90&&Math.abs(dy)>Math.abs(dx)*1.8){if(dy>0&&U&&top)go(U);else if(dy<0&&D&&bot)go(D);return;}if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8)return;if(dx<0&&N)go(N);else if(dx>0&&P)go(P);},{passive:true});})();</script></head><body><div class="wrap">
<header>
  <div class="title">Sözlük</div>
  <input class="search" id="q" placeholder="" aria-label="Sözlükte ara (İngilizce ya da Türkçe)" autocomplete="off" autocapitalize="off" spellcheck="false">
</header>
<div id="hint" class="hint"><span class="big">📖</span></div>
<div id="list"></div>
</div>
<script>
const GROUPS=KELIMELER;   // kelimeler.js
const posTag={"isim":"isim","fiil":"fiil","sıfat":"sıfat","zarf":"zarf","edat":"edat","bağlaç":"bağlaç","zamir":"zamir","belirteç":"belirteç","ünlem":"ünlem","sayı":"sayı","kip fiili":"kip fiili","yardımcı fiil":"yard. fiil","artikel":"artikel","mastar":"mastar"};
// Tüm 3000 kelimeyi tek listede topla.
const WORDS=[];
GROUPS.forEach(g=>g.items.forEach(it=>WORDS.push({w:it.w,tr:it.tr||'',ok:it.ok||'',en:it.en||'',ex:it.ex||[],pos:it.pos||'',level:g.level,s:(it.w+' '+(it.tr||'')).toLowerCase()})));

let LANG="en-US",voices=[];const synth=window.speechSynthesis;
function loadV(){voices=synth?synth.getVoices():[];}
if(synth){loadV();synth.onvoiceschanged=loadV;}
function pick(l){if(!voices.length)loadV();return voices.find(v=>v.lang===l)||voices.find(v=>v.lang&&v.lang.slice(0,2)===l.slice(0,2))||null;}
function speak(t){if(!synth)return;synth.cancel();const u=new SpeechSynthesisUtterance(t);const v=pick(LANG);if(v)u.voice=v;u.lang=LANG;u.rate=0.9;synth.speak(u);}
function slugOf(w){var b=w.replace(/\(.*?\)/g,'').split(',')[0];return b.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
let wordAudio=null,curBtn=null;
function clrBtn(){if(curBtn){curBtn.classList.remove('playing');curBtn=null;}}
function playAudioUrl(url,btn){return new Promise(res=>{
  try{if(wordAudio){wordAudio.pause();wordAudio=null;}}catch(e){}
  clrBtn();if(btn){curBtn=btn;btn.classList.add('playing');}
  const a=new Audio(url);wordAudio=a;let done=false;const ok=()=>{if(!done){done=true;res(true);}};
  a.addEventListener('playing',ok);a.onended=()=>clrBtn();a.onerror=()=>{if(!done){done=true;clrBtn();res(false);}};
  a.play().then(ok).catch(()=>{if(!done){done=true;clrBtn();res(false);}});
});}
// 🔊: uygulamaya gömülü ses → yoksa cihaz sesi.
async function say(w,btn){
  if(synth)synth.cancel();
  try{if(await playAudioUrl('/audio/'+slugOf(w)+'.mp3',btn))return;}catch(e){}
  clrBtn();speak(w);
}

const listEl=document.getElementById('list'),hintEl=document.getElementById('hint');
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  if(!q){listEl.innerHTML='';hintEl.style.display='';return;}
  hintEl.style.display='none';
  const hits=WORDS.filter(d=>d.s.includes(q));
  // Tam eşleşme / baştan eşleşme önce gelsin.
  hits.sort((a,b)=>{const aw=a.w.toLowerCase(),bw=b.w.toLowerCase();
    const ae=aw===q?0:(aw.startsWith(q)?1:2),be=bw===q?0:(bw.startsWith(q)?1:2);
    return ae!==be?ae-be:aw.localeCompare(bw);});
  const shown=hits.slice(0,60);
  if(!shown.length){listEl.innerHTML='';return;}
  let html=shown.map((d,i)=>`<div class="card">
    <div class="row1"><span class="word">${d.w}</span><span class="tag">${posTag[d.pos]||''}${d.pos?' · ':''}${d.level}</span></div>
    ${d.ok?`<div class="ok">Okunuş: ${d.ok}</div>`:''}
    <div class="tr">${d.tr}</div>
    ${d.en?`<div class="en">${d.en}</div>`:''}
    ${(d.ex&&d.ex.length)?d.ex.map(s=>`<div class="ex">${s}</div>`).join(''):''}
  </div>`).join('');
  listEl.innerHTML=html;
  // Karta basınca o kelimeyi oku.
  listEl.querySelectorAll('.card').forEach((c,i)=>{c.onclick=()=>say(shown[i].w,c);});
}
document.getElementById('q').addEventListener('input',render);
// Arkadaşlar bağlantısında bekleyen istek sayısı (son bilinen)
document.body.addEventListener('touchstart',()=>{if(synth&&!voices.length)loadV();},{once:true});
</script><style>:root{--navh:58px}body{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom))}.oxbar{position:fixed;left:0;right:0;bottom:0;z-index:9990;display:flex;justify-content:center;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.oxbar nav{display:flex;width:100%;max-width:600px}.oxbar a{flex:1;height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font:600 10.5px system-ui,-apple-system,Roboto,Arial,sans-serif;text-decoration:none}.oxbar a.on{color:var(--ink);font-weight:800}.oxbar a.on svg{stroke:var(--accent,#3B6EA5)}.oxbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style><div class="oxbar"><nav aria-label="Sayfalar"><a href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Liste</a><a href="kartlar.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h11a2 2 0 0 1 2 2v13M4 8h11a2 2 0 0 1 2 2v10H6a2 2 0 0 1-2-2z"/></svg>Kartlar</a><a href="istatistik.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>İlerleme</a><a href="sozluk.html" class=on aria-current=page><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h8"/></svg>Sözlük</a><a href="arkadaslar.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 12 0v1M16 3.5a4 4 0 0 1 0 7.5M22 21v-1a6 6 0 0 0-4-5.6"/></svg>Arkadaş</a><a href="ayarlar.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ayarlar</a></nav></div><script>document.querySelectorAll('.oxbar a').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var u=a.getAttribute('href');if(a.classList.contains('on'))return;if(window.oxCikisSor)window.oxCikisSor(function(){location.href=u;},u);else location.href=u;});});</script></body></html>
