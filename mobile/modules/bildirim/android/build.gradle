// Bildirimler (src/main/java/expo/modules/bildirim): seri / tekrar hatırlatmaları, arkadaşlık isteği ve dürtme
// (uygulama kapalıyken de, WorkManager). Uygulamaya Expo'nun yerel modül yoluyla girer (modules/).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.github.ahmetayarsss.thousand'
version = '1.0.0'

android {
  namespace "expo.modules.bildirim"
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  implementation "androidx.work:work-runtime:2.9.1"   // arka planda kontrol ve zamanlı hatırlatmalar
}
