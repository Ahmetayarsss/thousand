<!doctype html><html><head><meta charset="utf-8">
<style>
:root{--ink:#1B2430;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:#eef1f5;font-family:system-ui,Arial;display:flex;flex-wrap:wrap;gap:18px;padding:22px;justify-content:center}
.tile{width:230px}
.num{font-weight:800;font-size:20px;color:#1B2430;text-align:center;margin-bottom:6px}
.card{position:relative;width:230px;height:230px;background:var(--card);border:1px solid #c7d2e3;border-radius:20px;overflow:hidden;box-shadow:0 8px 20px rgba(20,30,50,.14)}
/* çift yuvarlak çerçeve (ortak) */
.frame{position:absolute;inset:13px;border:1.6px solid var(--ink);border-radius:18px}
.frame::after{content:"";position:absolute;inset:5px 3px;border:1.6px solid var(--ink);border-radius:13px}
/* köşe ornamenti */
.cnr{position:absolute;top:5px;left:3px}
.arc{position:absolute;top:0;left:0;width:18px;height:18px}
.dot{position:absolute;width:4.4px;height:4.4px;background:var(--ink);border-radius:50%}

/* 1: yaprak (içe bombeli) + nokta köşede */
.v1 .arc{border-bottom:1.4px solid var(--ink);border-right:1.4px solid var(--ink);border-bottom-right-radius:18px}
.v1 .dot{top:3px;left:3px}
/* 2: yaprak + nokta bombe ortasında */
.v2 .arc{border-bottom:1.4px solid var(--ink);border-right:1.4px solid var(--ink);border-bottom-right-radius:18px}
.v2 .dot{top:10.5px;left:10.5px}
/* 3: köşeye sarılı yay + nokta köşede */
.v3 .arc{border-top:1.4px solid var(--ink);border-left:1.4px solid var(--ink);border-top-left-radius:18px}
.v3 .dot{top:3px;left:3px}
/* 4: yay yok, sadece köşe noktası */
.v4 .arc{display:none}
.v4 .dot{top:1px;left:1px}
</style></head><body>
<div class="tile"><div class="num">1</div><div class="card v1"><div class="frame"></div><div class="cnr"><div class="arc"></div><div class="dot"></div></div></div></div>
<div class="tile"><div class="num">2</div><div class="card v2"><div class="frame"></div><div class="cnr"><div class="arc"></div><div class="dot"></div></div></div></div>
<div class="tile"><div class="num">3</div><div class="card v3"><div class="frame"></div><div class="cnr"><div class="arc"></div><div class="dot"></div></div></div></div>
<div class="tile"><div class="num">4</div><div class="card v4"><div class="frame"></div><div class="cnr"><div class="arc"></div><div class="dot"></div></div></div></div>
</body></html>
