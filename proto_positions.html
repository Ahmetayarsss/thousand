<!doctype html><html><head><meta charset="utf-8">
<style>
:root{--ink:#1B2430;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:#eef1f5;font-family:system-ui,Arial;display:flex;flex-wrap:wrap;gap:16px;padding:20px;justify-content:center}
.tile{width:180px}
.num{font-weight:800;font-size:18px;color:#1B2430;text-align:center;margin-bottom:5px}
.card{position:relative;width:180px;height:180px;background:var(--card);border:1px solid #c7d2e3;border-radius:20px;overflow:hidden;box-shadow:0 6px 16px rgba(20,30,50,.13)}
.frame{position:absolute;inset:13px;border:1.6px solid var(--ink);border-radius:18px}
.frame::after{content:"";position:absolute;inset:5px 3px;border:1.6px solid var(--ink);border-radius:13px}
.cnr{position:absolute;top:5px;left:3px}
.arc{position:absolute;top:0;left:0;width:18px;height:18px;border-bottom:1.4px solid var(--ink);border-right:1.4px solid var(--ink);border-bottom-right-radius:18px}
.dot{position:absolute;width:4.4px;height:4.4px;background:var(--ink);border-radius:50%}
</style></head><body>
<div class="tile"><div class="num">1</div><div class="card"><div class="frame"></div><div class="cnr"><div class="arc"></div><div class="dot" style="top:0.5px;left:0.5px"></div></div></div></div>
<div class="tile"><div class="num">2</div><div class="card"><div class="frame"></div><div class="cnr"><div class="arc"></div><div class="dot" style="top:2.5px;left:2.5px"></div></div></div></div>
<div class="tile"><div class="num">3</div><div class="card"><div class="frame"></div><div class="cnr"><div class="arc"></div><div class="dot" style="top:4.5px;left:4.5px"></div></div></div></div>
<div class="tile"><div class="num">4</div><div class="card"><div class="frame"></div><div class="cnr"><div class="arc"></div><div class="dot" style="top:6.5px;left:6.5px"></div></div></div></div>
<div class="tile"><div class="num">5</div><div class="card"><div class="frame"></div><div class="cnr"><div class="arc"></div><div class="dot" style="top:8.5px;left:8.5px"></div></div></div></div>
<div class="tile"><div class="num">6</div><div class="card"><div class="frame"></div><div class="cnr"><div class="arc"></div><div class="dot" style="top:10.5px;left:10.5px"></div></div></div></div>
<div class="tile"><div class="num">7</div><div class="card"><div class="frame"></div><div class="cnr"><div class="arc"></div><div class="dot" style="top:4px;left:14.7px"></div></div></div></div>
<div class="tile"><div class="num">8</div><div class="card"><div class="frame"></div><div class="cnr"><div class="arc"></div><div class="dot" style="top:14.7px;left:4px"></div></div></div></div>
<div class="tile"><div class="num">9</div><div class="card"><div class="frame"></div><div class="cnr"><div class="arc"></div><div class="dot" style="top:-2px;left:15.8px"></div></div></div></div>
<div class="tile"><div class="num">10</div><div class="card"><div class="frame"></div><div class="cnr"><div class="arc"></div><div class="dot" style="top:15.8px;left:-2px"></div></div></div></div>
</body></html>
