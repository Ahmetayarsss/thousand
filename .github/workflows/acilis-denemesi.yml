name: Uygulama açılıyor mu

# PR'larda uygulamayı yayın derlemesiyle aynı ayarlarla (release, küçültme açık) derler ve bir Android emülatöründe
# açar; açılışta çökerse ya da kapanırsa kırmızı yanar. Ardından gezinme denemesi (gezinme-denemesi.sh): kaydırma,
# geri tuşu, pencere; beklenen sayfa gelmezse kırmızı yanar. Yayındaki APK yalnız arm64; emülatör için x86_64 derlenir
# (kod aynı). Hiçbir şey yayınlanmaz. Ekran görüntüsü ve logcat iş akışı çıktısı olarak kalır.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/**"
      - "data/**"
      - ".github/workflows/acilis-denemesi.yml"
      - ".github/betikler/acilis-denemesi.sh"
      - ".github/betikler/gezinme-denemesi.sh"

concurrency:
  group: acilis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acilis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bağımlılıklar (npm ci)
        working-directory: mobile
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "npm ci denemesi $i başarısız, tekrar..."; sleep $((i * 10))
          done

      - name: Android projesini üret (expo prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      # İmza: Expo'nun hata ayıklama anahtarı (yalnız emülatör için).
      - name: APK derle (release, x86_64)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64

      - name: Emülatöre izin (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde aç
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/betikler/acilis-denemesi.sh mobile/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/acilis" && bash .github/betikler/gezinme-denemesi.sh "$RUNNER_TEMP/acilis/gezinme"

      - name: Ekran görüntüsü ve logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acilis-denemesi
          path: ${{ runner.temp }}/acilis
          if-no-files-found: ignore
